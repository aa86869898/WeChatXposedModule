<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>乐少 · 第1版风格 续作（对话框样机）</title>
<style>
  :root{
    --bg:#0f0a17; --surface:#1b1428; --sc-low:#241a38; --sc-high:#2d2145;
    --primary:#C9A9FF; --primary-deep:#9F7BFF; --on-primary:#2A1550;
    --g1:#8B5CF6; --g2:#A78BFA; --g3:#D946EF; --g4:#FF6FB0;
    --on-surface:#EDE7F6; --on-var:#B8AECE; --outline:#5b4d78;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#2a1b45 0%,var(--bg) 55%);
       color:var(--on-surface);font-family:-apple-system,"Segoe UI","PingFang SC",sans-serif;padding:28px 18px 80px}
  h1{font-size:22px;margin:0 0 6px}
  .sub{color:var(--on-var);font-size:13px;line-height:1.7;margin-bottom:18px}
  .sticky{position:sticky;top:0;z-index:20;backdrop-filter:blur(10px);background:rgba(15,10,23,.82);
          border:1px solid #2e2246;border-radius:14px;padding:12px 16px;margin-bottom:22px}
  .sticky b{color:var(--primary)}
  h2{font-size:16px;margin:34px 0 14px;display:flex;align-items:center;gap:10px}
  h2:before{content:"";width:6px;height:18px;border-radius:3px;background:linear-gradient(180deg,var(--g1),var(--g3))}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
  .card{background:linear-gradient(180deg,#1c1430,#16101f);border:1px solid #2e2246;border-radius:18px;
        overflow:hidden;transition:.2s;position:relative}
  .card.picked{border-color:var(--primary);box-shadow:0 0 0 2px rgba(201,169,255,.35),0 12px 30px rgba(139,92,246,.25)}
  .card .demo{padding:22px 18px;min-height:236px;display:flex;align-items:center;justify-content:center}
  .card .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-top:1px solid #2a1f42}
  .card .name{font-size:13px;font-weight:600}
  .card .desc{font-size:11px;color:var(--on-var);margin-top:2px;line-height:1.5}
  .pick{border:1px solid var(--primary);color:var(--primary);background:transparent;border-radius:999px;
        padding:6px 14px;font-size:12px;cursor:pointer;white-space:nowrap}
  .card.picked .pick{background:var(--primary);color:var(--on-primary);font-weight:700}
  .phone{width:100%;max-width:300px;background:var(--surface);border-radius:22px;padding:16px 14px;
         box-shadow:0 18px 40px rgba(0,0,0,.45),inset 0 0 0 1px #35264f}
  .cwrap{width:100%;max-width:300px;background:var(--surface);border-radius:22px;padding:18px 16px;
         box-shadow:0 18px 40px rgba(0,0,0,.45),inset 0 0 0 1px #35264f}
  .btitle{font-size:15px;font-weight:700;color:var(--on-surface)}
  .ctitle{font-size:12px;color:var(--on-var);text-align:center;margin-bottom:14px}
  .bar{position:relative;height:10px;border-radius:999px;background:var(--sc-high);overflow:hidden}
  .bar>i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px;
         background:linear-gradient(90deg,var(--g1),var(--g2),var(--g3),var(--g4))}
  .bar.thin{height:5px}
  .pct{text-align:center;color:var(--primary);font-weight:800}
  .pct.pctnum{font-size:24px;padding:8px 0 4px}
  .prow{display:flex;justify-content:space-between;font-size:12px;color:var(--on-var);margin-bottom:8px}
  .step{display:flex;align-items:center;gap:10px;padding:7px 4px;font-size:12.5px;color:var(--on-var)}
  .step .mk{width:20px;height:20px;border-radius:50%;border:2px solid var(--outline);display:grid;place-items:center;
            font-size:11px;color:transparent;flex:none;transition:.3s}
  .step.done{color:var(--on-surface)}
  .step.done .mk{background:linear-gradient(135deg,var(--g1),var(--g3));border-color:transparent;color:#fff}
  .step.on .mk{border-color:var(--primary);color:var(--primary);animation:pulse 1.4s infinite}
  /* ring */
  .ring{width:118px;height:118px;border-radius:50%;
        background:conic-gradient(var(--primary) var(--deg,0deg),#33244f 0deg);position:relative;display:grid;place-items:center}
  .ring:after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--surface);
        box-shadow:inset 0 0 18px rgba(139,92,246,.35)}
  .ring span{position:relative;z-index:1;font-size:26px;font-weight:800;color:var(--primary)}
  .dots{display:flex;gap:10px;justify-content:center;margin-top:14px}
  .dot{width:12px;height:12px;border-radius:50%;background:#33244f;transition:.3s}
  .dot.on{background:var(--primary);box-shadow:0 0 12px var(--primary);transform:scale(1.25)}
  .dot.dn{background:linear-gradient(135deg,var(--g1),var(--g3))}
  .plabel2{font-size:11.5px;color:var(--on-var);text-align:center;margin-top:12px}
  /* step cards */
  .scard{border-radius:12px;background:var(--sc-low);padding:10px 12px;margin-bottom:8px;font-size:12px;
         display:flex;align-items:center;gap:10px;border:1px solid transparent;transition:.3s}
  .scard.active{border-color:var(--primary);box-shadow:0 0 18px rgba(159,123,255,.35);animation:breathe 1.6s ease-in-out infinite}
  .scard.done{opacity:.62}
  @keyframes breathe{50%{box-shadow:0 0 26px rgba(159,123,255,.6)}}
  .mini{height:4px;border-radius:999px;background:#33244f;flex:1;overflow:hidden}
  .mini>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g1),var(--g3));transition:width .3s}
  .mk{color:transparent}
  /* tiles */
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .tile{aspect-ratio:1;border-radius:12px;background:var(--sc-low);display:grid;place-items:center;font-size:11px;
        color:var(--on-var);border:1px solid #2f2450;position:relative;overflow:hidden}
  .tile.run:before{content:"";position:absolute;width:150%;height:150%;
        background:conic-gradient(transparent 0 70%,rgba(217,70,239,.75));animation:spin 1.1s linear infinite}
  .tile.run:after{content:"";position:absolute;inset:2px;border-radius:10px;background:var(--surface)}
  .tile.run b{position:relative;z-index:2}
  .tile.done{background:linear-gradient(135deg,var(--g1),var(--g3));color:#fff;border-color:transparent}
  .tile.done b{color:#fff}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* timeline */
  .tl{position:relative;padding-left:22px}
  .tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:#33244f}
  .tlnode{position:relative;margin-bottom:12px;font-size:12.5px;color:var(--on-var)}
  .tlnode:before{content:"";position:absolute;left:-22px;top:2px;width:16px;height:16px;border-radius:50%;
        background:var(--surface);border:2px solid var(--outline);transition:.3s}
  .tlnode.on:before{background:var(--primary);border-color:var(--primary);box-shadow:0 0 0 5px rgba(201,169,255,.18);animation:pulse 1.4s infinite}
  .tlnode.dn:before{background:linear-gradient(135deg,var(--g1),var(--g3));border-color:transparent}
  .tlnode.dn{color:var(--on-surface)}
  @keyframes pulse{50%{box-shadow:0 0 0 9px rgba(201,169,255,.05)}}
  /* minimal */
  .minimal .numbig{font-size:52px;font-weight:800;text-align:center;
        background:linear-gradient(90deg,var(--g1),var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hairline{height:3px;border-radius:3px;background:#2c2046;overflow:hidden;margin:14px 0 12px}
  .hairline>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g1),var(--g3))}
  .mstep{font-size:11.5px;color:var(--on-var);display:flex;justify-content:space-between;padding:3px 0;transition:.3s}
  .mstep.dn{color:var(--primary)}
  /* G holo */
  .holowrap{position:relative;display:inline-flex;margin:8px 0 2px}
  .orbit{position:absolute;inset:-9px;border-radius:50%;animation:spin 2.4s linear infinite}
  .orbit:before{content:"";position:absolute;top:-4px;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;
        background:var(--primary);box-shadow:0 0 12px var(--primary)}
  .chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:16px}
  .chip{font-size:11px;padding:4px 10px;border-radius:999px;background:var(--sc-high);color:var(--on-var);transition:.3s}
  .chip.on{background:var(--primary);color:var(--on-primary);font-weight:700}
  .chip.dn{background:linear-gradient(135deg,var(--g1),var(--g3));color:#fff}
  .dbar2{margin-top:6px}
  /* I icon steps */
  .iconsteps{display:flex;justify-content:space-between;margin:16px 2px 14px}
  .iconstep{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:14px;color:var(--on-var);
        background:var(--sc-high);border:2px solid var(--outline);transition:.3s}
  .iconstep.on{border-color:var(--primary);color:var(--primary);box-shadow:0 0 0 5px rgba(201,169,255,.15);animation:pulse 1.4s infinite}
  .iconstep.dn{background:linear-gradient(135deg,var(--g1),var(--g3));border-color:transparent;color:#fff}
  /* J log */
  .log{background:#120c1e;border-radius:12px;padding:10px 12px;font-family:ui-monospace,Menlo,monospace;
       font-size:10.5px;color:var(--on-var);height:92px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:5px}
  .logline{opacity:0;transform:translateY(4px);animation:login .3s forwards}
  @keyframes login{to{opacity:1;transform:none}}
  .logline b{color:var(--primary)}
  /* conversion widgets */
  .capsule{height:16px;border-radius:999px;background:var(--sc-high);position:relative;overflow:hidden}
  .capsule>i{position:absolute;inset:0 auto 0 0;width:0;border-radius:999px;
        background:linear-gradient(90deg,var(--g1),var(--g2),var(--g3),var(--g4),var(--g2),var(--g1));
        background-size:200% 100%;animation:flow 1.6s linear infinite}
  @keyframes flow{to{background-position:-200% 0}}
  .caphead{position:absolute;top:-4px;bottom:-4px;width:16px;border-radius:50%;background:#fff;opacity:.85;filter:blur(2px);transition:left .3s}
  .wave{display:flex;align-items:flex-end;gap:3px;height:46px}
  .wave>i{flex:1;background:#33244f;border-radius:2px;height:30%;transition:.2s}
  .wave>i.on{background:linear-gradient(180deg,var(--g4),var(--g1))}
  .eqwrap{display:flex;align-items:center;justify-content:center;gap:16px}
  .eqring{width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--g3) var(--deg,0deg),#33244f 0);
          display:grid;place-items:center;position:relative}
  .eqring:after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--surface)}
  .eqbars{position:relative;z-index:1;display:flex;gap:3px;align-items:flex-end;height:34px}
  .eqbars>i{width:4px;background:var(--primary);border-radius:2px;animation:eq 1s ease-in-out infinite}
  .eqbars>i:nth-child(2){animation-delay:.2s}.eqbars>i:nth-child(3){animation-delay:.35s}.eqbars>i:nth-child(4){animation-delay:.5s}
  @keyframes eq{0%,100%{height:20%}50%{height:100%}}
  .segs{display:flex;gap:6px}
  .segs>i{flex:1;height:14px;border-radius:5px;background:var(--sc-high);transition:.25s}
  .segs>i.on{background:linear-gradient(180deg,var(--g2),var(--g1))}
  .neon{height:14px;border-radius:999px;background:#241a38;position:relative;overflow:hidden;box-shadow:inset 0 0 10px rgba(0,0,0,.5)}
  .neon>i{position:absolute;top:0;bottom:0;width:0;background:linear-gradient(90deg,#6d28d9,#c084fc,#f0abfc);box-shadow:0 0 16px #d946ef}
  .neon .scan{position:absolute;top:0;bottom:0;width:60px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
        animation:scan 1.4s linear infinite}
  @keyframes scan{from{left:-60px}to{left:100%}}
  .cnum{text-align:center;color:var(--primary);font-weight:800;font-size:20px;margin-top:12px}
  .centerwave{display:flex;align-items:center;gap:3px;height:60px}
  .centerwave>i{flex:1;background:#33244f;border-radius:3px;height:16%;transition:height .13s}
  .centerwave>i.on{background:linear-gradient(180deg,var(--g4),var(--g1))}
  .glowbar{height:16px;border-radius:999px;background:var(--sc-high);position:relative;overflow:hidden;box-shadow:inset 0 0 12px rgba(0,0,0,.4)}
  .glowbar>i{position:absolute;inset:0 auto 0 0;width:0;border-radius:999px;background:linear-gradient(90deg,var(--g1),var(--g3));box-shadow:0 0 18px var(--g3)}
  .glowbar .breath{position:absolute;inset:0;box-shadow:inset 0 0 16px rgba(217,70,239,.7);opacity:.35;animation:breathe2 1.5s ease-in-out infinite}
  @keyframes breathe2{50%{opacity:.95}}
  .linearea{width:100%;height:84px;display:block;border-radius:12px;background:var(--sc-low)}
  .icorow{display:flex;align-items:center;gap:12px}
  .ico32{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;font-size:16px;flex:none;
        background:linear-gradient(135deg,var(--g1),var(--g3));box-shadow:0 6px 14px rgba(139,92,246,.4);animation:icob 1.2s ease-in-out infinite}
  @keyframes icob{50%{transform:scale(1.08)}}
  .stream{font-family:ui-monospace,Menlo,monospace;font-size:17px;letter-spacing:.14em;color:var(--primary);
        text-align:center;font-variant-numeric:tabular-nums;margin-bottom:10px}
</style>
</head>
<body>
  <h1>乐少 WeChat 模块 · 第1版风格续作（对话框样机）</h1>
  <div class="sub">
    沿用第 1 版观感：每个方案都是完整的深色对话框样机（标题 + 副标题 + 进度 + 步骤），而非孤立控件。<br>
    第 1 组：DexKit 加载窗口（A–J，10 款）；第 2 组：音频转语音「转换中」（1–10，10 套）。<br>
    点卡片右下角「选择」，或直接把编号发我（如「C + 6」）。
  </div>
  <div class="sticky">已选：<b id="pickedText">尚未选择</b></div>

  <h2>一、DexKit 加载窗口（10 款）</h2>
  <div class="grid" id="loadGrid"></div>
  <h2>二、音频转语音「转换中」（10 套）</h2>
  <div class="grid" id="convGrid"></div>

<script>
const NAMES=['初始化引擎','扫描资源','定位类名','绑定 Hook','加载完成'];
const r=(a)=>a.map(t=>'<div class="step jstep"><div class="mk">✓</div>'+t+'</div>').join('');
const scardRows=(a)=>a.map(t=>'<div class="scard jstep"><span>'+t+'</span><div class="mini jmini"><i></i></div><span class="mk">✓</span></div>').join('');
const tlRows=(a)=>a.map(t=>'<div class="tlnode jstep">'+t+'</div>').join('');
const mRows=(a)=>a.map(t=>'<div class="mstep jstep"><span>'+t+'</span><span>✓</span></div>').join('');
const chips=(a)=>a.map(t=>'<span class="chip jstep">'+t+'</span>').join('');
const iconSteps=(a)=>a.map(t=>'<div class="iconstep jstep">'+t+'</div>').join('');
const dots5=()=>'<i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i>';
const tiles6=()=>['dex','方法','模板','回调','缓存','完成'].map(t=>'<div class="tile"><b>'+t+'</b></div>').join('');
const waveBars=(n)=>Array.from({length:n},()=>'<i></i>').join('');
const segBars=(n)=>Array.from({length:n},()=>'<i></i>').join('');

const load=[
 {id:'A',name:'渐变扫描卡（现行增强）',desc:'经典款：圆角卡 + 流光渐变条 + 居中大字百分比 + ○/✓ 步骤列表',
  html:()=>'<div class="btitle">乐少V3 功能扫描</div><div style="font-size:11px;color:var(--on-var);margin:2px 0 12px">动态适配微信混淆类名</div>'
    +'<div class="bar"><i class="jbar"></i></div><div class="pct pctnum jpct">0%</div><div class="jsteps">'+r(NAMES.slice(0,4))+'</div>'},
 {id:'B',name:'环形雷达',desc:'中心发光圆环 + 环内百分比 + 底部步骤圆点（激活放大/完成填色）',
  html:()=>'<div style="text-align:center"><div style="font-size:13px;color:var(--on-var);margin-bottom:12px">正在扫描类名</div>'
    +'<div style="display:flex;justify-content:center"><div class="ring jring"><span class="jpct">0%</span></div></div>'
    +'<div class="dots jdots">'+dots5()+'</div><div class="plabel2 jlabel">初始化引擎</div></div>'},
 {id:'C',name:'步骤流卡',desc:'每步一张小卡：处理中呼吸高亮 + 内嵌迷你进度；完成后卡面淡化并显示 ✓',
  html:()=>'<div class="prow"><span>功能扫描</span><span class="jpct" style="color:var(--primary)">0%</span></div>'
    +'<div class="bar thin" style="margin-bottom:12px"><i class="jbar"></i></div><div class="jsteps">'+scardRows(NAMES.slice(0,5))+'</div>'},
 {id:'D',name:'网格瓦片',desc:'功能六宫格：处理中瓦片转圈描边，完成瓦片填充品牌渐变 + ✓；顶部贯穿细进度',
  html:()=>'<div class="prow"><span>功能扫描</span><span class="jpct" style="color:var(--primary)">0%</span></div>'
    +'<div class="bar thin" style="margin-bottom:12px"><i class="jbar"></i></div><div class="tiles jtiles">'+tiles6()+'</div>'},
 {id:'E',name:'时间轴',desc:'左侧竖轴节点：当前节点脉冲光环，完成节点渐变填充；底部总进度条',
  html:()=>'<div class="prow"><span>功能扫描</span><span class="jpct" style="color:var(--primary)">0%</span></div>'
    +'<div class="tl jsteps">'+tlRows(NAMES.slice(0,4))+'</div><div class="bar thin" style="margin-top:10px"><i class="jbar"></i></div>'},
 {id:'F',name:'极简脉冲',desc:'超大渐变数字 + 一条细线进度 + 右侧内联步骤文字；完成行整体转主色 ✓',
  html:()=>'<div class="minimal"><div class="numbig jpct">0%</div><div class="hairline"><i class="jbar"></i></div>'
    +'<div class="jsteps">'+mRows(NAMES.slice(0,4))+'</div></div>'},
 {id:'G',name:'光环轨道',desc:'进度圆环外圈一颗光点绕行 + 环内百分比；下方步骤胶囊逐个点亮',
  html:()=>'<div style="text-align:center"><div style="font-size:12px;color:var(--on-var);margin-bottom:4px">正在扫描类名</div>'
    +'<div class="holowrap"><div class="ring jring"><span class="jpct">0%</span></div><div class="orbit"></div></div>'
    +'<div class="chips jsteps">'+chips(NAMES.slice(0,4))+'</div></div>'},
 {id:'H',name:'双轨进度',desc:'上轨总进度、下轨当前步局部进度，双条对比；下方步骤卡列表',
  html:()=>'<div class="prow"><span>功能扫描</span><span class="jpct" style="color:var(--primary)">0%</span></div>'
    +'<div class="bar thin"><i class="jbar"></i></div><div class="bar thin dbar2"><i class="jbar2"></i></div>'
    +'<div class="jsteps" style="margin-top:12px">'+scardRows(NAMES.slice(0,4))+'</div>'},
 {id:'I',name:'图标步骤横排',desc:'横向四个圆形步骤图标（当前脉冲、完成变渐变）+ 底部细进度',
  html:()=>'<div class="prow"><span>功能扫描</span><span class="jpct" style="color:var(--primary)">0%</span></div>'
    +'<div class="iconsteps jsteps">'+iconSteps(['⚙','✦','⌘','⚡'])+'</div><div class="bar thin"><i class="jbar"></i></div>'},
 {id:'J',name:'控制台日志',desc:'顶部细进度 + 终端风格日志逐行打印（> 步骤 … ok），极客调试感',
  html:()=>'<div class="prow"><span>功能扫描</span><span class="jpct" style="color:var(--primary)">0%</span></div>'
    +'<div class="bar thin" style="margin-bottom:12px"><i class="jbar"></i></div><div class="log"></div>'},
];

const conv=[
 {id:'1',name:'流光胶囊',desc:'圆角胶囊，品牌多色渐变持续流动 + 亮光头部；下方百分比',
  html:()=>'<div class="ctitle">音频转语音 · 发送中 (2/5段)</div><div class="capsule"><i class="jbar"></i><span class="caphead"></span></div><div class="cnum jpct">0%</div>'},
 {id:'2',name:'声波律动',desc:'条形声波从左到右点亮，已点亮条随音量跳动，形象表达声音正在被处理',
  html:()=>'<div class="ctitle">音频转语音 · 转码中</div><div class="wave jwave">'+waveBars(32)+'</div><div class="cnum jpct">0%</div>'},
 {id:'3',name:'环形均衡器',desc:'外圈环形进度 + 中心跳动均衡器条，科技感强，突出音频属性',
  html:()=>'<div class="ctitle">音频转语音 · 合成中</div><div class="eqwrap"><div class="eqring jring"><div class="eqbars"><i></i><i></i><i></i><i></i></div></div><div class="cnum jpct" style="margin:0;font-size:26px">0%</div></div>'},
 {id:'4',name:'分段格子',desc:'按“段”分格逐格点亮，与真实发送段数一一对应，进度最直观',
  html:()=>'<div class="ctitle">音频转语音 · 发送中 (2/5段)</div><div class="segs jsegs">'+segBars(5)+'</div><div class="cnum jpct jsegtext">2 / 5 段</div>'},
 {id:'5',name:'霓虹扫描',desc:'暗轨道 + 霓虹填充 + 左右扫描高光；不确定态扫动，确定态从左推进',
  html:()=>'<div class="ctitle">音频转语音 · 处理中</div><div class="neon"><i class="jbar"></i><span class="scan"></span></div><div class="cnum jpct">0%</div>'},
 {id:'6',name:'中心声波',desc:'声波从中心向两侧展开，中间对称律动，音乐播放器观感',
  html:()=>'<div class="ctitle">音频转语音 · 波形分析</div><div class="centerwave jwave">'+waveBars(24)+'</div><div class="cnum jpct">0%</div>'},
 {id:'7',name:'呼吸光晕',desc:'胶囊内发光呼吸 + 进度填充，沉稳高级，弱化“等待”焦虑',
  html:()=>'<div class="ctitle">音频转语音 · 合成中</div><div class="glowbar"><i class="jbar"></i><span class="breath"></span></div><div class="cnum jpct">0%</div>'},
 {id:'8',name:'折线面积',desc:'折线随进度向右绘制，下方渐变面积填充，数据感与设计感兼顾',
  html:()=>{const id='s8';let ln='';let area='M0,80 ';for(let x=0;x<=240;x+=16){const y=74-52*(x/240)-9*Math.sin(x/28);ln+=x+','+y.toFixed(1)+' ';area+='L'+x+','+y.toFixed(1)+' ';}area+='L240,80 Z';
    return '<div class="ctitle">音频转语音 · 转码中</div><svg class="linearea" viewBox="0 0 240 84" preserveAspectRatio="none">'
    +'<defs><clipPath id="c'+id+'"><rect class="jclip" x="0" y="0" width="0" height="84"/></clipPath>'
    +'<linearGradient id="a'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--g3)" stop-opacity=".5"/><stop offset="1" stop-color="var(--g1)" stop-opacity="0"/></linearGradient></defs>'
    +'<path d="'+area+'" fill="url(#a'+id+')" clip-path="url(#c'+id+')"/>'
    +'<polyline points="'+ln+'" fill="none" stroke="var(--primary)" stroke-width="3" stroke-linejoin="round" clip-path="url(#c'+id+')"/></svg>'
    +'<div class="cnum jpct">0%</div>'}},
 {id:'9',name:'音频图标',desc:'音符图标脉冲 + 内嵌进度条，最贴近业务语义，一眼看懂是语音',
  html:()=>'<div class="ctitle">音频转语音 · 合成中</div><div class="icorow"><span class="ico32">♪</span><div class="mini jmini" style="height:8px"><i></i></div></div><div class="cnum jpct">0%</div>'},
 {id:'10',name:'数字流',desc:'等宽数字滚动跳动 + 极简进度条，极客风，适合技术型提示',
  html:()=>'<div class="ctitle">音频转语音 · 转码中</div><div class="stream jstream">0000</div><div class="bar thin"><i class="jbar"></i></div><div class="cnum jpct">0%</div>'},
];

function cardHTML(group,d){
  return '<div class="card" data-group="'+group+'" data-id="'+d.id+'">'
   +'<div class="demo">'+(group==='load'?'<div class="phone">'+d.html()+'</div>':'<div class="cwrap">'+d.html()+'</div>')+'</div>'
   +'<div class="foot"><div><div class="name">'+d.id+' · '+d.name+'</div><div class="desc">'+d.desc+'</div></div>'
   +'<button class="pick">选择</button></div></div>';
}
document.getElementById('loadGrid').innerHTML=load.map(d=>cardHTML('load',d)).join('');
document.getElementById('convGrid').innerHTML=conv.map(d=>cardHTML('conv',d)).join('');

/* ---------------- driver ---------------- */
const cards=[...document.querySelectorAll('.card')];
cards.forEach((card,ci)=>{
  const pcts=[...card.querySelectorAll('.jpct')];
  const bars=[...card.querySelectorAll('.jbar')];
  const bar2s=[...card.querySelectorAll('.jbar2')];
  const rings=[...card.querySelectorAll('.jring')];
  const clips=[...card.querySelectorAll('.jclip')];
  const capheads=[...card.querySelectorAll('.caphead')];
  const stepBox=card.querySelector('.jsteps');
  const stepNodes=stepBox?[...stepBox.children]:[];
  const dotBox=card.querySelector('.jdots');
  const dotNodes=dotBox?[...dotBox.children]:[];
  const waveBox=card.querySelector('.jwave');
  const waveNodes=waveBox?[...waveBox.children]:[];
  const segBox=card.querySelector('.jsegs');
  const segNodes=segBox?[...segBox.children]:[];
  const tileBox=card.querySelector('.jtiles');
  const tileNodes=tileBox?[...tileBox.children]:[];
  const minis=[...card.querySelectorAll('.jmini>i')];
  const streams=[...card.querySelectorAll('.jstream')];
  const log=card.querySelector('.log');
  const labels=[...card.querySelectorAll('.jlabel')];
  const segtext=[...card.querySelectorAll('.jsegtext')];
  let p=(ci*13)%100, lastIdx=-1;
  function idxOf(n){return Math.min(n-1,Math.max(0,Math.floor(p/100*n)));}
  setInterval(()=>{
    p+=1.5; if(p>100)p=0;
    const P=Math.round(p);
    pcts.forEach(e=>e.textContent=P+'%');
    bars.forEach(e=>e.style.width=p+'%');
    bar2s.forEach(e=>e.style.width=Math.min(100,p*1.6)+'%');
    rings.forEach(e=>e.style.setProperty('--deg',(p*3.6)+'deg'));
    clips.forEach(c=>{const w=c.ownerSVGElement?c.ownerSVGElement.viewBox.baseVal.width:240;c.setAttribute('width',(p/100*w).toFixed(1));});
    capheads.forEach(h=>h.style.left='calc('+p+'% - 8px)');
    minis.forEach(m=>m.style.width=p+'%');
    if(stepNodes.length){
      const idx=idxOf(stepNodes.length);
      stepNodes.forEach((n,k)=>{n.classList.toggle('dn',k<idx);n.classList.toggle('done',k<idx);n.classList.toggle('on',k===idx);n.classList.toggle('active',k===idx);n.classList.toggle('run',k===idx);});
      if(labels.length) labels.forEach(l=>l.textContent=NAMES[Math.min(NAMES.length-1,idx)]);
      if(log){ if(idx!==lastIdx){ lastIdx=idx; const div=document.createElement('div'); div.className='logline'; div.innerHTML='<b>&gt;</b> '+NAMES[Math.min(NAMES.length-1,idx)]+' … ok'; log.appendChild(div); if(log.children.length>6) log.removeChild(log.firstChild); } }
    } else if(log){
      const idx=idxOf(NAMES.length);
      if(idx!==lastIdx){ lastIdx=idx; const div=document.createElement('div'); div.className='logline'; div.innerHTML='<b>&gt;</b> '+NAMES[idx]+' … ok'; log.appendChild(div); if(log.children.length>6) log.removeChild(log.firstChild); }
    }
    if(dotNodes.length){
      const idx=idxOf(dotNodes.length);
      dotNodes.forEach((d,k)=>{d.classList.toggle('dn',k<idx);d.classList.toggle('on',k===idx);});
      if(labels.length) labels.forEach(l=>l.textContent=NAMES[Math.min(NAMES.length-1,idx)]);
    }
    if(tileNodes.length){
      const idx=idxOf(tileNodes.length);
      tileNodes.forEach((t,k)=>{t.classList.toggle('done',k<idx);t.classList.toggle('run',k===idx);});
    }
    if(waveNodes.length){const c=waveNodes.length;waveNodes.forEach((el,i)=>{const on=(i/c)*100<=p;el.classList.toggle('on',on);el.style.height=on?(30+Math.random()*60)+'%':'28%';});}
    if(segNodes.length){const filled=Math.max(1,Math.ceil(p/100*segNodes.length));segNodes.forEach((s,i)=>s.classList.toggle('on',i<filled));if(segtext.length) segtext.forEach(t=>t.textContent=filled+' / '+segNodes.length+' 段');}
    if(streams.length) streams.forEach(s=>s.textContent=String(Math.round(p*99.99)).padStart(4,'0'));
  },60);
});

/* ---------------- pick ---------------- */
const picks={load:null,conv:null};
const NAME={load:{},conv:{}};
load.forEach(d=>NAME.load[d.id]=d.id+' '+d.name);
conv.forEach(d=>NAME.conv[d.id]=d.id+' '+d.name);
document.querySelectorAll('.card').forEach(card=>{
  card.querySelector('.pick').addEventListener('click',()=>{
    const g=card.dataset.group,id=card.dataset.id;
    if(picks[g]===id){picks[g]=null;card.classList.remove('picked');}
    else{picks[g]=id;document.querySelectorAll('.card[data-group="'+g+'"]').forEach(c=>c.classList.remove('picked'));card.classList.add('picked');}
    const parts=[];
    if(picks.load)parts.push('加载窗-'+NAME.load[picks.load]);
    if(picks.conv)parts.push('转换进度-'+NAME.conv[picks.conv]);
    document.getElementById('pickedText').textContent=parts.length?parts.join('  |  '):'尚未选择';
  });
});
</script>
</body>
</html>
