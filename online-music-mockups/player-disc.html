<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>在线音乐 · 播放器碟片 10 套（淡色渐变旋转）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg1:#F9F6FF; --bg2:#EEE7FA; --card:#FFFFFF; --t1:#2A2340; --t2:#6F6389;
    --line:#EFE8FB; --chip:#F1EAFC; --g0:#8B5CF6; --g1:#D8B4FE; --g2:#FFAFCC;
    /* 淡色盘体色板 */
    --p1:#F2EAFE; --p2:#FBF1FF; --p3:#FFEFF7; --p4:#EAF4FF; --p5:#FFF6EA; --p6:#FFEDF6;
    --gloss:rgba(255,255,255,.92);
  }
  body.dark {
    --bg1:#130D1C; --bg2:#1A1226; --card:#1D1530; --t1:#EDE7FB; --t2:#B0A0D2;
    --line:#2C2145; --chip:#241A3A; --g0:#9F7BFF; --g1:#DCC3FF; --g2:#FFB8D4;
    --p1:#3A2E58; --p2:#4C3968; --p3:#5A3C5C; --p4:#2E3A58; --p5:#4A3E2E; --p6:#4C3244;
    --gloss:rgba(255,255,255,.55);
  }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--t1); min-height: 100vh; padding: 26px 16px 80px;
    background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%); background-attachment: fixed;
  }
  body.dark { background: linear-gradient(180deg,#130D1C 0%,#1A1226 100%); }
  .head { max-width: 1560px; margin: 0 auto; }
  .head h1 { font-size: 23px; }
  .head h1 em { font-style: normal; background: linear-gradient(92deg, var(--g0), var(--g1), var(--g2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .head p { font-size: 12.5px; color: var(--t2); margin-top: 9px; line-height: 1.9; max-width: 1120px; }
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 11px 14px; max-width: 1120px; box-shadow: 0 10px 24px rgba(96,66,160,.08); }
  .bar button { border: none; cursor: pointer; font-weight: 800; font-size: 12.5px; color: #fff; background: linear-gradient(135deg, var(--g0), var(--g1)); padding: 9px 16px; border-radius: 11px; }
  .bar .g { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--t2); }
  .bar .o { font-weight: 800; color: var(--g0); min-width: 26px; text-align: center; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 140px; accent-color: var(--g0); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(390px, 1fr)); gap: 30px; max-width: 1560px; margin: 26px auto 0; }
  .opt { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .opt .label { font-size: 13px; font-weight: 800; }
  .opt .label b { font-size: 10.5px; color: #fff; background: linear-gradient(135deg, var(--g0), var(--g2)); padding: 2px 7px; border-radius: 999px; margin-right: 7px; vertical-align: 1px; }
  .opt .label i { font-style: normal; font-size: 10px; color: #fff; background: linear-gradient(135deg, var(--g2), var(--g0)); padding: 2px 7px; border-radius: 999px; margin-left: 7px; }
  .opt .spec { font-size: 11px; color: var(--t2); }

  .phone { width: 390px; height: 844px; border-radius: 44px; overflow: hidden; position: relative; background: var(--bg2); box-shadow: 0 26px 60px rgba(60,40,110,.28), 0 0 0 10px rgba(20,12,32,.85); }
  body.dark .phone { box-shadow: 0 26px 60px rgba(0,0,0,.6), 0 0 0 10px rgba(0,0,0,.9); }
  .status { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 26px; font-size: 12.5px; font-weight: 700; }
  .screen { position: absolute; inset: 44px 0 0 0; display: flex; flex-direction: column; padding: 0 22px; }
  .title { font-weight: 800; text-align: center; }
  .sub { color: var(--t2); text-align: center; }
  .bars { position: relative; width: 100%; }
  .bars canvas { display: block; width: 100%; }
  .times { display: flex; justify-content: space-between; font-size: 11px; color: var(--t2); font-variant-numeric: tabular-nums; }
  .track { height: 5px; border-radius: 999px; background: var(--chip); overflow: hidden; }
  .track > i { display: block; height: 100%; width: 42%; border-radius: 999px; background: linear-gradient(90deg, var(--g0), var(--g1), var(--g2)); }

  /* ===== 碟片：淡色渐变 + 旋转 ===== */
  .discwrap { display: flex; align-items: center; justify-content: center; }
  .disc {
    width: 232px; height: 232px; border-radius: 50%; position: relative; overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.35), 0 18px 42px rgba(120,90,180,.22);
    animation: spin 12s linear infinite;
  }
  body.dark .disc { box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), 0 18px 42px rgba(0,0,0,.5); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .lyr { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; }
  .cover {
    position: absolute; left: 28%; top: 28%; width: 44%; height: 44%; border-radius: 50%; z-index: 3;
    background: linear-gradient(135deg, var(--g0), var(--g1), var(--g2));
    display: flex; align-items: center; justify-content: center; color: #fff; font-size: 30px;
    box-shadow: 0 6px 18px rgba(80,50,140,.35);
  }
  .cover:after { content: ""; position: absolute; width: 14%; height: 14%; border-radius: 50%; background: rgba(255,255,255,.85); box-shadow: inset 0 0 0 2px rgba(0,0,0,.12); }

  /* 01 柔光扫过 */
  .disc.s1 { background: linear-gradient(135deg, var(--p1), var(--p2) 48%, var(--p3)); }
  .disc.s1 .lyr.a { background: conic-gradient(from 200deg, rgba(255,255,255,0) 0deg, var(--gloss) 42deg, rgba(255,255,255,0) 96deg, rgba(255,255,255,0) 360deg); }

  /* 02 双高光金属 */
  .disc.s2 { background: linear-gradient(135deg, var(--p2), var(--p1) 50%, var(--p4)); }
  .disc.s2 .lyr.a { background: conic-gradient(from 160deg, rgba(255,255,255,0) 0deg, var(--gloss) 30deg, rgba(255,255,255,0) 62deg, rgba(255,255,255,0) 178deg, var(--gloss) 208deg, rgba(255,255,255,0) 248deg); }
  .disc.s2 .lyr.b { background: radial-gradient(circle at 68% 72%, rgba(255,255,255,.55), transparent 46%); }

  /* 03 淡色虹彩 */
  .disc.s3 { background: conic-gradient(from 0deg, var(--p1), var(--p6), var(--p4), var(--p2), var(--p1)); }
  .disc.s3 .lyr.a { background: conic-gradient(from 0deg, rgba(255,175,204,.5), rgba(216,180,254,.5), rgba(160,200,255,.5), rgba(255,175,204,.5)); mix-blend-mode: screen; opacity: .8; }
  body.dark .disc.s3 .lyr.a { opacity: .5; }

  /* 04 珠光渐变 */
  .disc.s4 { background: linear-gradient(160deg, var(--p5), var(--p2) 55%, var(--p1)); }
  .disc.s4 .lyr.a { background: repeating-conic-gradient(from 0deg, rgba(255,255,255,0) 0deg 10deg, rgba(255,255,255,.5) 10deg 14deg); opacity: .5; }
  .disc.s4 .lyr.b { background: radial-gradient(circle at 30% 26%, rgba(255,255,255,.6), transparent 52%); }

  /* 05 奶油丝绸 */
  .disc.s5 { background: linear-gradient(135deg, var(--p5) 0%, var(--p3) 60%, var(--p6) 100%); }
  .disc.s5 .lyr.a { background: linear-gradient(115deg, rgba(255,255,255,0) 32%, var(--gloss) 50%, rgba(255,255,255,0) 68%); }

  /* 06 淡粉流光 */
  .disc.s6 { background: radial-gradient(120% 120% at 70% 28%, var(--p3), var(--p2) 55%, var(--p1)); }
  .disc.s6 .lyr.a { background: radial-gradient(circle at 32% 30%, rgba(255,255,255,.78), transparent 55%); }
  .disc.s6 .lyr.b { background: radial-gradient(circle at 74% 76%, rgba(255,255,255,.42), transparent 48%); }

  /* 07 星尘细点 */
  .disc.s7 { background: linear-gradient(135deg, var(--p1), var(--p4) 55%, var(--p2)); }
  .disc.s7 .lyr.a {
    background-image: radial-gradient(rgba(255,255,255,.95) 1px, transparent 1.7px);
    background-size: 9px 9px; opacity: .7;
  }
  body.dark .disc.s7 .lyr.a { background-image: radial-gradient(rgba(255,255,255,.55) 1px, transparent 1.7px); }
  .disc.s7 .lyr.b { background: radial-gradient(circle at 40% 34%, rgba(255,255,255,.55), transparent 58%); }

  /* 08 雾面磨砂 */
  .disc.s8 { background: linear-gradient(135deg, var(--p2), var(--p5) 50%, var(--p1)); }
  .disc.s8 .lyr.a { background: conic-gradient(from 40deg, rgba(255,255,255,0) 0deg, rgba(255,255,255,.4) 70deg, rgba(255,255,255,0) 150deg, rgba(255,255,255,.34) 250deg, rgba(255,255,255,0) 330deg); }
  .disc.s8 .lyr.b { background: radial-gradient(circle, transparent 58%, rgba(255,255,255,.4) 62%, transparent 72%); }

  /* 09 极光渐变 */
  .disc.s9 { background: conic-gradient(from 90deg, var(--p4), var(--p1), var(--p3), #EAFBF4, var(--p5), var(--p4)); }
  .disc.s9 .lyr.a { background: radial-gradient(circle at 28% 30%, rgba(255,255,255,.6), transparent 50%), radial-gradient(circle at 74% 70%, rgba(255,255,255,.42), transparent 46%); }
  body.dark .disc.s9 { background: conic-gradient(from 90deg,#26313F,#2E2748,#3A2A44,#26403A,#4A3E2E,#26313F); }

  /* 10 玻璃高光 */
  .disc.s10 { background: linear-gradient(135deg, var(--p4), var(--p1) 50%, var(--p6)); }
  .disc.s10 .lyr.a { background: radial-gradient(circle at 26% 22%, rgba(255,255,255,.98) 0 3%, rgba(255,255,255,0) 16%); }
  .disc.s10 .lyr.b { background: linear-gradient(120deg, rgba(255,255,255,0) 40%, rgba(255,255,255,.5) 50%, rgba(255,255,255,0) 60%); }

  .frow { display: flex; justify-content: space-around; }
  .fbtn { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 10px; color: var(--t2); }
  .fbtn .i { font-size: 21px; color: var(--t1); }

  /* 底部：播放顺序最左，三键居中且间距拉开 */
  .transport { position: relative; display: flex; align-items: center; justify-content: center; gap: 44px; padding: 0 4px; }
  .transport .order { position: absolute; left: 4px; font-size: 19px; color: var(--g0); }
  .transport .ic { font-size: 24px; color: var(--t1); }
  .transport .play { width: 68px; height: 68px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; color: #fff; background: linear-gradient(135deg, var(--g0), var(--g1), var(--g2)); box-shadow: 0 12px 26px rgba(139,92,246,.4); }
</style>
</head>
<body>

<div class="head">
  <h1>播放器碟片 · <em>10 套淡色渐变旋转风格</em></h1>
  <p>上中部<b>淡色渐变碟片</b>持续旋转（盘体 + 光泽层同步转，中心圆形＝封面位）。以下 10 套仅差异在<b>盘体渐变与旋转光泽</b>；标题 / <b>旋律柱（宽 90%）</b> / 进度 / 功能按钮排 / 底部控制一致。浅 / 暗可切，BPM 可调。</p>
  <div class="bar">
    <button id="playBtn">暂停</button>
    <div class="g">节奏 BPM <input id="bpm" type="range" min="60" max="180" value="120"><span class="o" id="bpmO">120</span></div>
    <button id="themeBtn">暗色</button>
  </div>
</div>

<div class="grid" id="grid"></div>

<script>
(function () {
  var st = { play: true, t: 0, last: 0, bpm: 120, dark: false };
  var dpr = Math.max(1, Math.min(3, devicePixelRatio || 1));
  function cols() { return st.dark ? ['#9F7BFF', '#DCC3FF', '#FFB8D4'] : ['#8B5CF6', '#D8B4FE', '#FFAFCC']; }
  function env(t) { var p = 60000 / st.bpm, f = (t % p) / p; return Math.pow(1 - f, 2.2); }
  function spectrum(t, n) {
    var e = env(t), a = new Float32Array(n);
    for (var i = 0; i < n; i++) {
      var base = 0.16 + 0.30 * Math.abs(Math.sin(i * 1.7 + t / 320));
      var kick = e * (1 - i / n) * 0.98;
      var noise = 0.13 * Math.abs(Math.sin(i * 3.13 + t / 90));
      a[i] = Math.max(0, Math.min(1, base + kick + noise));
    }
    return a;
  }
  function rr(ctx, x, y, w, h, r) {
    r = Math.max(0, Math.min(r, w / 2, h / 2)); if (r <= 0) { ctx.rect(x, y, w, h); return; }
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function drawBars(ctx, W, H, t) {
    var n = 22, span = W * 0.90, x0 = (W - span) / 2, gap = 3;
    var bw = (span - gap * (n - 1)) / n, sp = spectrum(t, n);
    var c = cols(), p = (t / 3200) % 1, shift = 2 * span * p;
    var g = ctx.createLinearGradient(x0 - shift, 0, x0 + 2 * span - shift, 0);
    g.addColorStop(0, c[0]); g.addColorStop(0.33, c[1]); g.addColorStop(0.66, c[2]); g.addColorStop(1, c[0]);
    ctx.fillStyle = g;
    var base = H * 0.98;
    for (var i = 0; i < n; i++) {
      var bh = 6 + sp[i] * H * 0.88;
      rr(ctx, x0 + (bw + gap) * i, base - bh, bw, bh, Math.min(bw, 4)); ctx.fill();
    }
  }
  var VIZ = [];
  function mountViz(el) {
    var cv = document.createElement('canvas'); el.appendChild(cv);
    var it = { cv: cv, ctx: cv.getContext('2d') };
    it.size = function () {
      var w = el.clientWidth || 340, h = 160;
      cv.width = w * dpr; cv.height = h * dpr; cv.style.height = h + 'px';
      it.ctx.setTransform(dpr, 0, 0, dpr, 0, 0); it.w = w; it.h = h;
    };
    it.size(); VIZ.push(it); return it;
  }

  function build(cls) {
    return function (s) {
      var w = document.createElement('div'); w.className = 'screen';
      w.innerHTML =
        '<div class="discwrap" style="margin-top:6px"><div class="disc ' + cls + '">'
        + '  <div class="lyr a"></div>'
        + '  <div class="lyr b"></div>'
        + '  <div class="cover">\u266A</div>'
        + '</div></div>'
        + '<div class="title" style="margin:16px 0 4px;font-size:20px">夜曲</div>'
        + '<div class="sub" style="font-size:12.5px">周杰伦 · 十一月的萧邦</div>'
        + '<div class="bars" data-viz style="margin:16px 0 8px"></div>'
        + '<div class="times"><span>01:24</span><span>03:51</span></div>'
        + '<div class="track" style="margin:6px 0 14px"><i></i></div>'
        + '<div class="frow" style="margin-bottom:18px">'
        + '  <div class="fbtn"><span class="i">\u2661</span><span>收藏</span></div>'
        + '  <div class="fbtn"><span class="i">\u2B07</span><span>下载</span></div>'
        + '  <div class="fbtn"><span class="i">\u27A4</span><span>发送</span></div>'
        + '  <div class="fbtn"><span class="i">\u25C8</span><span>音质</span></div>'
        + '</div>'
        + '<div class="transport" style="padding-bottom:16px">'
        + '  <span class="order">\uD83D\uDD01</span>'
        + '  <span class="ic">\u23EE</span>'
        + '  <span class="play">\u25B6</span>'
        + '  <span class="ic">\u23ED</span>'
        + '</div>';
      s.appendChild(w);
      mountViz(w.querySelector('[data-viz]'));
    };
  }

  var OPTIONS = [
    { d: '柔光扫过', spec: '淡紫底，单一高光带随碟旋转扫过', cls: 's1', rec: true },
    { d: '双高光金属', spec: '淡蓝紫底，两道高光带立体感更强', cls: 's2' },
    { d: '淡色虹彩', spec: '淡彩虹锥形渐变，screen 混合转动', cls: 's3' },
    { d: '珠光渐变', spec: '奶油珠光，细密放射纹缓缓旋转', cls: 's4' },
    { d: '奶油丝绸', spec: '奶油粉底，斜向柔滑光带', cls: 's5' },
    { d: '淡粉流光', spec: '粉紫径向光，双光斑随碟转动', cls: 's6' },
    { d: '星尘细点', spec: '淡蓝紫底，白色细点星尘旋转', cls: 's7' },
    { d: '雾面磨砂', spec: '雾面淡底，宽幅柔光带 + 内圈', cls: 's8' },
    { d: '极光渐变', spec: '淡青紫粉多段锥形，极光流动', cls: 's9' },
    { d: '玻璃高光', spec: '淡蓝紫底，硬高光点 + 斜向镜面', cls: 's10' }
  ];

  var grid = document.getElementById('grid');
  OPTIONS.forEach(function (o, i) {
    var wrap = document.createElement('div'); wrap.className = 'opt';
    var label = document.createElement('div'); label.className = 'label';
    label.innerHTML = '<b>' + (i + 1 < 10 ? '0' + (i + 1) : (i + 1)) + '</b>' + o.d + (o.rec ? '<i>推荐</i>' : '');
    var spec = document.createElement('div'); spec.className = 'spec'; spec.textContent = o.spec;
    var phone = document.createElement('div'); phone.className = 'phone';
    var status = document.createElement('div'); status.className = 'status';
    status.innerHTML = '<span>9:41</span><span>\u25CF\u25CF\u25CF</span>';
    phone.appendChild(status);
    build(o.cls)(phone);
    wrap.appendChild(label); wrap.appendChild(spec); wrap.appendChild(phone);
    grid.appendChild(wrap);
  });

  function frame(ts) {
    if (!st.last) st.last = ts;
    var dt = Math.min(60, ts - st.last); st.last = ts;
    if (st.play) st.t += dt;
    VIZ.forEach(function (it) {
      if (it.cv.clientWidth && it.w !== it.cv.clientWidth) it.size();
      it.ctx.clearRect(0, 0, it.w, it.h);
      drawBars(it.ctx, it.w, it.h, st.t);
    });
    requestAnimationFrame(frame);
  }
  addEventListener('resize', function () { VIZ.forEach(function (it) { it.size(); }); });
  document.getElementById('playBtn').onclick = function () { st.play = !st.play; this.textContent = st.play ? '暂停' : '播放'; };
  document.getElementById('themeBtn').onclick = function () { st.dark = !st.dark; document.body.classList.toggle('dark', st.dark); this.textContent = st.dark ? '浅色' : '暗色'; };
  document.getElementById('bpm').oninput = function () { st.bpm = +this.value; document.getElementById('bpmO').textContent = this.value; };
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
