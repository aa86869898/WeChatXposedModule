<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>播放器图标 · 第二批全新 10 套</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root { --page1:#F6F2FF; --page2:#ECE4FA; --ink:#2A2340; --ink2:#6F6389; --g0:#8B5CF6; --g1:#D8B4FE; --g2:#FFAFCC; }
  body.darkpage { --page1:#100A18; --page2:#191026; --ink:#EDE7FB; --ink2:#B0A0D2; }
  body { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--ink);
    min-height: 100vh; padding: 26px 16px 90px; background: linear-gradient(180deg, var(--page1), var(--page2)) fixed; }
  .head { max-width: 1520px; margin: 0 auto; }
  .head h1 { font-size: 23px; }
  .head h1 em { font-style: normal; background: linear-gradient(92deg, var(--g0), var(--g1), var(--g2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .head p { font-size: 12.5px; color: var(--ink2); margin-top: 9px; line-height: 1.95; max-width: 1180px; }
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 14px; background: rgba(255,255,255,.72);
    border: 1px solid rgba(139,92,246,.18); border-radius: 16px; padding: 11px 14px; max-width: 1180px; box-shadow: 0 10px 24px rgba(96,66,160,.1); backdrop-filter: blur(8px); }
  body.darkpage .bar { background: rgba(30,22,51,.82); border-color: rgba(159,123,255,.24); }
  .bar button { border: none; cursor: pointer; font-weight: 800; font-size: 12.5px; color: #fff; background: linear-gradient(135deg, var(--g0), var(--g1)); padding: 9px 16px; border-radius: 11px; }
  .bar .tag { font-size: 12px; color: var(--ink2); font-weight: 700; }

  .grid { max-width: 1520px; margin: 28px auto 0; display: flex; flex-direction: column; gap: 44px; }
  .opt { display: flex; flex-direction: column; gap: 14px; }
  .top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .label { font-size: 15px; font-weight: 900; }
  .label b { font-size: 11px; color: #fff; background: linear-gradient(135deg, var(--g0), var(--g2)); padding: 3px 9px; border-radius: 999px; margin-right: 9px; }
  .spec { font-size: 12px; color: var(--g0); font-weight: 700; }
  .desc { font-size: 12px; color: var(--ink2); line-height: 1.7; }
  .wrap { display: flex; gap: 30px; flex-wrap: wrap; align-items: flex-start; }
  .col { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .col > .t { font-size: 11px; font-weight: 800; color: var(--ink2); letter-spacing: .5px; }

  .th-light { --bg:#F7F4FF; --bg2:#ECE4FA; --card:#FFFFFF; --t1:#2A2340; --t2:#6F6389; --line:#ECE4FA; --chip:#F1EAFC;
    --g0:#8B5CF6; --g1:#D8B4FE; --g2:#FFAFCC; --ong:#fff;
    --c1:#8B5CF6; --c2:#FF8FC7; --c3:#6FC3F7; --c4:#7DE3B8;
    --shadow:0 14px 34px rgba(80,56,150,.16); }
  .th-dark { --bg:#120C1B; --bg2:#1A1226; --card:#1E1633; --t1:#EDE7FB; --t2:#B0A0D2; --line:#2C2145; --chip:#241A3A;
    --g0:#9F7BFF; --g1:#DCC3FF; --g2:#FFB8D4; --ong:#fff;

  .strip .cell .lb { font-size: 9.5px; color: var(--t2); }

  .phone.dark { box-shadow: 0 22px 52px rgba(0,0,0,.6), 0 0 0 9px rgba(0,0,0,.9); }
  .status { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 26px; font-size: 12.5px; font-weight: 800; color: var(--t1); }
  .screen { position: absolute; inset: 44px 0 0 0; display: flex; flex-direction: column; padding: 0 20px; color: var(--t1); background: linear-gradient(180deg, var(--bg), var(--bg2)); }
  .pgrow { flex: 1; min-height: 2px; }
  .pback { font-size: 13px; font-weight: 800; color: var(--g0); padding-top: 6px; }
  .ptitle { text-align: center; font-size: 20px; font-weight: 900; }
  .partist { text-align: center; font-size: 12.5px; color: var(--t2); margin-top: 4px; }
  .pdisc { width: 158px; height: 158px; margin: 0 auto; border-radius: 50%; position: relative;
    background: radial-gradient(circle at 34% 30%, var(--g1), var(--g2) 42%, var(--g0) 78%);
    box-shadow: 0 18px 40px rgba(120,80,200,.35), inset 0 0 0 12px rgba(255,255,255,.1); }
  .pdisc::before { content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, rgba(255,255,255,0), rgba(255,255,255,.34), rgba(255,255,255,0) 40%, rgba(255,255,255,.18) 70%, rgba(255,255,255,0));
    animation: spin 7s linear infinite; }
  .pdisc span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 28px; color: #fff; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .peq { display: flex; align-items: flex-end; justify-content: center; gap: 5px; height: 94px; }

  .ptimes { display: flex; justify-content: space-between; font-size: 11px; color: var(--t2); margin-top: 6px; font-variant-numeric: tabular-nums; }

  .frow { display: flex; align-items: center; justify-content: space-around; gap: 6px; }
  .fbtn { appearance: none; border: 0; background: transparent; font: inherit; color: var(--t2); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 4px; }
  .fbtn .fl { font-size: 10px; }
  .trow { display: flex; align-items: center; justify-content: center; gap: 30px; position: relative; }
  .tico { appearance: none; border: 0; background: transparent; cursor: pointer; color: var(--t1); display: grid; place-items: center; padding: 4px; }
  .torder { position: absolute; left: 0; }
  .tplay { width: 64px; height: 64px; border: 0; cursor: pointer; display: grid; place-items: center; color: #fff;
    background: linear-gradient(135deg, var(--g0), var(--g1), var(--g2)); box-shadow: 0 12px 26px rgba(139,92,246,.42); border-radius: 50%; }
  .nav { display: flex; align-items: center; margin: 0 -20px; padding: 9px 8px 13px; background: var(--card); }
  .ni { flex: 1; appearance: none; border: 0; background: transparent; font: inherit; color: var(--t2); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0; }
  .ni .ni-i { font-size: 19px; line-height: 1; }
  .ni .ni-l { font-size: 10px; }
  .ni.on { color: var(--g0); font-weight: 800; }

  .paused .pdisc::before, .paused .peq i { animation-play-state: paused; }
</style>
</head>

  <h1>播放器图标 · <em>第二批全新 10 套</em></h1>

    <button id="animBtn">暂停动画</button>
    <button id="pageBtn">页面暗色</button>
  </div>
</div>
<div class="grid" id="grid"></div>

<script>
(function () {
  var FAV='M12 20.5C12 20.5 3.6 15.5 3.6 9.8A4.3 4.3 0 0 1 12 7.5a4.3 4.3 0 0 1 8.4 2.3c0 5.7-8.4 10.7-8.4 10.7Z';

  var PLANE='M3.4 11.6 20.6 3.5 13.6 20.6 11.2 13.1Z', PLANE2='M11.2 13.1 20.6 3.5';

  var RA='M4 10a5 5 0 0 1 5-5h8.6', RAH='M14.8 2.6 17.9 5.6 14.8 8.6', RB='M20 14a5 5 0 0 1-5 5H6.4', RBH='M9.2 21.4 6.1 18.4 9.2 15.4';

      case 'fav': return mode === 'fill' ? P(FAV, fl) : P(FAV, st);

  /* ================= 10 个渲染器 ================= */

  function R11(name, size) {

  function R14(name, size) {

  function R15(name, size) {

    if (name === 'fav') b = '<path d="M12 20.6 3.6 10.4 7.6 6.6 12 10.6Z" fill="var(--c2)"/><path d="M12 20.6 20.4 10.4 16.4 6.6 12 10.6Z" fill="var(--c1)"/><path d="M7.6 6.6 12 3.2 16.4 6.6 12 10.6Z" fill="var(--c3)"/>';

  var SETS = [
    { n:'11', name:'糖果渐变实心', spec:'每个图标独立多彩渐变 · 粉/紫/蓝/薄荷', desc:'最讨喜的一套，彩色气泡糖果质感，年轻活泼；适合作为主打方案。' },
    { n:'12', name:'玻璃高光', spec:'半透明白玻璃填充 + 紫色描边 + 高光点', desc:'通透玻璃泡泡观感，柔亮精致，暗色下像发光水晶。' },
    { n:'13', name:'错位双线', spec:'紫色主形 + 粉色错位副本（印刷套版感）', desc:'复古印刷错位效果，潮牌气质，辨识度强。' },
    { n:'14', name:'点线描边', spec:'圆点虚线勾勒轮廓 · 轻量提示感', desc:'由圆点连成轮廓，轻盈、有节奏，适合轻提示风格。' },
    { n:'15', name:'折纸多面', spec:'多色多边形拼面 · 低多边形折纸', desc:'几何多面体，色彩分区，立体折纸的现代感。' },
    { n:'16', name:'徽章内嵌', spec:'圆角渐变徽章 + 白色剪影图标', desc:'应用图标式的整洁块面，白色剪影厚实醒目，最适合功能入口。' },
    { n:'17', name:'霓虹辉光', spec:'细亮描边 + 紫色外发光', desc:'夜色霓虹氛围，暗色下极佳；偏潮、偏夜间场景。' },
    { n:'18', name:'HUD 括号', spec:'四角支架 + 居中核心图标', desc:'科幻 HUD 仪表感，蓝色括号环绕，科技硬核。' },
    { n:'19', name:'星座连线', spec:'节点 + 细线连成图形', desc:'极简星座感，节点连线有夜空的浪漫，最轻量雅致。' },
    { n:'20', name:'长投影', spec:'紫色主形 + 粉色 45° 长投影', desc:'扁平长投影，动感方向性强，像层叠卡片。' }
  ];

  function frow(render) {
    var s = '<div class="frow">';
    FNAMES.forEach(function (f) { s += '<button class="fbtn"><span>' + icon(render, f[0], 24, false) + '</span><span class="fl">' + f[1] + '</span></button>'; });
    return s + '</div>';
  }
  function trow(render) {
    return '<div class="trow">'
      + '<button class="tico torder">' + icon(render, 'order', 21, false) + '</button>'
      + '<button class="tico">' + icon(render, 'prev', 25, false) + '</button>'
      + '<button class="tplay">' + icon(render, 'play', 26, true) + '</button>'
      + '<button class="tico">' + icon(render, 'next', 25, false) + '</button>'
      + '</div>';
  }
  function eq(hs) { var s = '<div class="peq">'; for (var i = 0; i < hs.length; i++) s += '<i style="height:' + hs[i] + 'px;animation-delay:' + (i * 0.09).toFixed(2) + 's"></i>'; return s + '</div>'; }
  function nav() {
    return '<div class="nav">'
      + '<button class="ni"><span class="ni-i">&#127968;</span><span class="ni-l">首页</span></button>'
      + '<button class="ni on"><span class="ni-i">&#127911;</span><span class="ni-l">播放</span></button>'
      + '<button class="ni"><span class="ni-i">&#128100;</span><span class="ni-l">我的</span></button></div>';
  }
  function phone(themeCls, render) {
    return '<div class="phone ' + themeCls + '">'
      + '<div class="status"><span>9:41</span><span>&#9679;&#9679;&#9679;</span></div>'
      + '<div class="screen"><div class="pback">&#8592; 返回</div><div class="pgrow"></div>'
      + '<div class="pdisc"><span>&#9834;</span></div><div class="pgrow"></div>'
      + '<div class="ptitle">夜曲</div><div class="partist">周杰伦 · 十一月的萧邦</div><div class="pgrow"></div>'
      + eq([40,72,54,90,60,82,48,68,34,58]) + '<div class="pgrow"></div>'
      + '<div class="ptrack"><i></i></div><div class="ptimes"><span>01:24</span><span>03:51</span></div><div class="pgrow"></div>'
      + trow(render) + '<div class="pgrow"></div>' + frow(render)
      + '<div class="pgrow" style="flex:0 0 6px"></div>' + nav() + '</div></div>';
  }
  function strip(themeCls, render) {
    var s = '<div class="strip ' + themeCls + '">';
    FNAMES.concat(TNAMES).forEach(function (f) { s += '<div class="cell">' + icon(render, f[0], 40, false) + '<div class="lb">' + f[1] + '</div></div>'; });
    return s + '</div>';
  }

  var grid = document.getElementById('grid');
  SETS.forEach(function (o) {
    var base = REND[o.n];
    var render = function (name, size) { return base(name, size); };
    var wrapEl = document.createElement('div'); wrapEl.className = 'opt';
    wrapEl.innerHTML = '<div class="top"><div class="label"><b>' + o.n + '</b>' + o.name + '</div><div class="spec">' + o.spec + '</div></div><div class="desc">' + o.desc + '</div>'
      + '<div class="wrap"><div class="col"><div class="t">图标条 · 浅色</div>' + strip('th-light', render) + '</div>'
      + '<div class="col"><div class="t">图标条 · 暗色</div>' + strip('th-dark', render) + '</div></div>'
      + '<div class="wrap"><div class="col"><div class="t">实景 · 浅色</div>' + phone('th-light', render) + '</div>'
      + '<div class="col"><div class="t">实景 · 暗色</div>' + phone('th-dark', render) + '</div></div>';
    grid.appendChild(wrapEl);
  });

  document.getElementById('animBtn').onclick = function () { document.body.classList.toggle('paused'); this.textContent = document.body.classList.contains('paused') ? '播放动画' : '暂停动画'; };
  document.getElementById('pageBtn').onclick = function () { document.body.classList.toggle('darkpage'); this.textContent = document.body.classList.contains('darkpage') ? '页面浅色' : '页面暗色'; };
})();
</script>
</body>
</html>
