<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>播放器图标 · 粗描边无背景 10 套</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root { --page1:#FBF9FF; --page2:#F1EAFE; --ink:#2A2340; --ink2:#6F6389; }
  body.darkpage { --page1:#150F1E; --page2:#100A18; --ink:#F2ECFB; --ink2:#B6A6D1; }
  body { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--ink);
    min-height: 100vh; padding: 26px 16px 90px; background: linear-gradient(180deg, var(--page1), var(--page2)) fixed; }
  .head { max-width: 1520px; margin: 0 auto; }
  .head h1 { font-size: 23px; }
  .head h1 em { font-style: normal; background: linear-gradient(92deg, #8B5CF6, #D8B4FE, #FFAFCC); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .head p { font-size: 12.5px; color: var(--ink2); margin-top: 9px; line-height: 1.95; max-width: 1180px; }
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 14px; background: rgba(255,255,255,.72);
    border: 1px solid rgba(139,92,246,.16); border-radius: 16px; padding: 11px 14px; max-width: 1180px; box-shadow: 0 10px 24px rgba(96,66,160,.08); backdrop-filter: blur(8px); }
  body.darkpage .bar { background: rgba(36,27,56,.82); border-color: rgba(159,123,255,.22); }
  .bar button { border: none; cursor: pointer; font-weight: 800; font-size: 12.5px; color: #fff; background: linear-gradient(135deg, #8B5CF6, #FFAFCC); padding: 9px 16px; border-radius: 11px; }
  .bar .tag { font-size: 12px; color: var(--ink2); font-weight: 700; }

  .grid { max-width: 1520px; margin: 28px auto 0; display: flex; flex-direction: column; gap: 46px; }
  .opt { display: flex; flex-direction: column; gap: 14px; }
  .top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .label { font-size: 15px; font-weight: 900; }
  .label b { font-size: 11px; color: #fff; background: linear-gradient(135deg, #8B5CF6, #FFAFCC); padding: 3px 9px; border-radius: 999px; margin-right: 9px; }
  .spec { font-size: 12px; font-weight: 700; color: #8B5CF6; }
  .desc { font-size: 12px; color: var(--ink2); line-height: 1.7; }
  .wrap { display: flex; gap: 30px; flex-wrap: wrap; align-items: flex-start; }
  .col { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .col > .t { font-size: 11px; font-weight: 800; color: var(--ink2); letter-spacing: .5px; }

  .th-light { --bg:#FBF9FF; --bg2:#F1EAFE; --card:#FFFFFF; --t1:#2A2340; --t2:#6F6389; --t3:#9A8CB8; --line:#DCCFF2; --chip:#ECE3FB; --g1:#8B5CF6; --g2:#D8B4FE; --g3:#FFAFCC; }
  .th-dark  { --bg:#150F1E; --bg2:#100A18; --card:#241B38; --t1:#F2ECFB; --t2:#B6A6D1; --t3:#8A79A8; --line:#3B2F55; --chip:#2A2040; --g1:#9F7BFF; --g2:#DCC3FF; --g3:#FFB8D4; }

  .strip { border-radius: 18px; padding: 14px 10px 10px; display: flex; gap: 4px; width: 390px; background: transparent; }
  .strip .cell { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .strip .cell .lb { font-size: 9.5px; color: var(--t3); font-weight: 700; }
  .strip .cell svg { display: block; }

  .phone { width: 390px; height: 844px; border-radius: 44px; overflow: hidden; position: relative; box-shadow: 0 22px 52px rgba(60,40,110,.24), 0 0 0 9px rgba(18,11,28,.86); }
  .phone.dark { box-shadow: 0 22px 52px rgba(0,0,0,.6), 0 0 0 9px rgba(0,0,0,.9); }
  .status { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 26px; font-size: 12.5px; font-weight: 800; color: var(--t1); }
  .screen { position: absolute; inset: 44px 0 0 0; display: flex; flex-direction: column; padding: 0 20px; color: var(--t1); background: linear-gradient(180deg, var(--bg), var(--bg2)); }
  .pgrow { flex: 1; min-height: 2px; }
  .pback { font-size: 13px; font-weight: 800; color: #8B5CF6; padding-top: 6px; }
  .ptitle { text-align: center; font-size: 20px; font-weight: 900; }
  .partist { text-align: center; font-size: 12.5px; color: var(--t2); margin-top: 4px; }
  .pdisc { width: 158px; height: 158px; margin: 0 auto; border-radius: 50%; position: relative;
    background: radial-gradient(circle at 34% 30%, var(--g2), var(--g3) 46%, var(--g1) 84%);
    box-shadow: 0 18px 40px rgba(120,80,200,.3), inset 0 0 0 12px rgba(255,255,255,.1); }
  .pdisc::before { content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, rgba(255,255,255,0), rgba(255,255,255,.32), rgba(255,255,255,0) 40%, rgba(255,255,255,.16) 70%, rgba(255,255,255,0));
    animation: spin 7s linear infinite; }
  .pdisc span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 28px; color: #fff; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .peq { display: flex; align-items: flex-end; justify-content: center; gap: 6px; height: 96px; }
  .peq i { width: 7px; border-radius: 6px 6px 3px 3px; background: linear-gradient(180deg, var(--g2), var(--g1), var(--g3)); animation: bump 1.05s ease-in-out infinite; }
  @keyframes bump { 0%,100% { transform: scaleY(.28); } 50% { transform: scaleY(1); } }
  .ptrack { height: 5px; border-radius: 999px; background: var(--chip); overflow: hidden; }
  .ptrack > i { display: block; height: 100%; width: 40%; border-radius: 999px; background: linear-gradient(90deg, var(--g1), var(--g3)); }
  .ptimes { display: flex; justify-content: space-between; font-size: 11px; color: var(--t2); margin-top: 6px; font-variant-numeric: tabular-nums; }

  .frow { display: flex; align-items: center; justify-content: space-around; gap: 6px; background: transparent; border: 0; }
  .fbtn { appearance: none; border: 0; background: transparent; font: inherit; color: var(--t3); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 9px; padding: 7px 4px; position: relative; }
  .fbtn .fl { font-size: 10px; font-weight: 700; }

  .trow { display: flex; align-items: center; justify-content: center; gap: 34px; position: relative; }
  .tico { appearance: none; border: 0; background: transparent; cursor: pointer; color: var(--t1); display: grid; place-items: center; padding: 4px; }
  .torder { position: absolute; left: 0; }
  .tplay { appearance: none; border: 0; background: transparent; box-shadow: none; cursor: pointer; display: grid; place-items: center; padding: 0; }

  .nav { display: flex; align-items: center; margin: 0 -20px; padding: 12px 8px 14px; background: transparent; border-top: 1px solid var(--line); }
  .ni { flex: 1; appearance: none; border: 0; background: transparent; font: inherit; color: var(--t3); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 3px 0; }
  .ni .nl { font-size: 10px; }
  .ni.on .nl { font-weight: 800; color: var(--t1); }

  .paused .pdisc::before, .paused .peq i { animation-play-state: paused; }
</style>
</head>
<body>
<div class="head">
  <h1>播放器图标 · <em>粗描边 · 无背景 · 模块配色 10 套</em></h1>
  <p>全部改用<b>更粗的渐变描边</b>、<b>不套任何背景容器</b>，颜色统一取自模块「葡萄气泡 · 流光渐变」三色（紫 → 淡紫 → 粉，暗色自动切换）。10 套只在<b>线宽、渐变朝向、笔角、节点</b>上做变化，克制且统一。</p>
  <div class="bar">
    <span class="tag">放大图标条可逐套比对</span>
    <button id="animBtn">暂停动画</button>
    <button id="pageBtn">页面暗色</button>
  </div>
</div>
<div class="grid" id="grid"></div>

<script>
(function () {
  var FAV='M12 19.9C12 19.9 4.3 15.2 4.3 10a3.9 3.9 0 0 1 7.7-1.6A3.9 3.9 0 0 1 19.7 10c0 5.2-7.7 9.9-7.7 9.9Z';
  var PLANE='M20.5 4.1 3.9 11.2l6.6 2.1 2.2 6.6L20.5 4.1Z', PLANE_F='M10.5 13.3 20.5 4.1';
  var RA='M4 10a4.6 4.6 0 0 1 4.6-4.6H17', RAH='M14.6 2.9 17.7 5.4 14.6 7.9', RB='M20 14a4.6 4.6 0 0 1-4.6 4.6H7', RBH='M9.4 21.1 6.3 18.6 9.4 16.1';
  var PLR='M8.6 5.7c0-1.02 1.13-1.62 1.96-1.03l8.2 6.3c.68.52.68 1.54 0 2.06l-8.2 6.3c-.83.59-1.96-.01-1.96-1.03z';

  function wrap(inner, size) {
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">' + inner + '</svg>';
  }
  var uid = 0;
  // 依据图形名返回描边内容；S=描边属性, fillCol=实心节点用色(可空)
  function inner(name, S, fillCol) {
    function P(d) { return '<path d="' + d + '" ' + S + '/>'; }
    function C(x, y, r) { return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" ' + (fillCol ? 'fill="' + fillCol + '" stroke="none"' : S) + '/>'; }
    switch (name) {
      case 'fav': return P(FAV);
      case 'dl': return P('M12 3.8v10') + P('M7.5 9.6 12 14.1 16.5 9.6') + P('M5.1 19.5h13.8');
      case 'send': return P(PLANE) + P(PLANE_F);
      case 'quality': return P('M4.5 8h15') + P('M4.5 16h15') + C(9.2, 8, 2.5) + C(14.8, 16, 2.5);
      case 'order': return P(RA) + P(RAH) + P(RB) + P(RBH);
      case 'prev': return P('M6 5.6v12.8') + P('M18 5.6 8.6 12 18 18.4Z');
      case 'next': return P('M18 5.6v12.8') + P('M6 5.6 15.4 12 6 18.4Z');
      case 'play': return P(PLR);
      case 'home': return P('M4 11 12 4.1l8 6.9') + P('M6.2 9.6V19a1 1 0 0 0 1 1h9.6a1 1 0 0 0 1-1V9.6');
      case 'disc': return C(12, 12, 8.2) + C(12, 12, 2.3);
      case 'user': return C(12, 8.3, 3.9) + P('M4.8 19.9a7.2 7.2 0 0 1 14.4 0');
    }
    return '';
  }
  // o: {g1,g2,g3, mid,tone('flow'|'purple'|'trio'|'reverse'), dir, sw, cap, glow, duo, solid, size}
  function gradStops(o) {
    var a = o.g1, b = o.g3, m = o.g2;
    if (o.tone === 'purple') return [['0', a], ['1', m]];
    if (o.tone === 'trio')   return [['0', a], ['.5', m], ['1', b]];
    if (o.tone === 'reverse') return [['0', b], ['1', a]];
    return [['0', a], ['1', b]];
  }
  function icon(name, size, o) {
    var id = 'g' + (uid++);
    var dirs = { h: [0, 12, 24, 12], v: [12, 0, 12, 24], '45': [0, 0, 24, 24], '135': [0, 24, 24, 0] };
    var d = dirs[o.dir] || dirs['45'];
    var stops = '';
    gradStops(o).forEach(function (s) { stops += '<stop offset="' + s[0] + '" stop-color="' + s[1] + '"/>'; });
    var defs = '<defs><linearGradient id="' + id + '" x1="' + d[0] + '" y1="' + d[1] + '" x2="' + d[2] + '" y2="' + d[3] + '" gradientUnits="userSpaceOnUse">' + stops + '</linearGradient></defs>';
    var col = 'url(#' + id + ')';
    var capJoin = o.cap === 'square' ? ' stroke-linecap="square" stroke-linejoin="miter"' : ' stroke-linecap="round" stroke-linejoin="round"';
    var S = 'fill="none" stroke="' + col + '" stroke-width="' + o.sw + '"' + capJoin;
    var fillCol = o.solid ? col : null;
    var core = inner(name, S, fillCol);
    if (o.duo) core = '<g transform="translate(1.2,1.2)" opacity=".26">' + inner(name, S, fillCol) + '</g>' + core;
    if (o.glow) core = '<g style="filter:drop-shadow(0 0 3.5px ' + o.g3 + 'aa)">' + core + '</g>';
    return wrap(defs + core, size);
  }
  // 播放键：渐变填充圆角三角，无任何圆底
  function playIcon(size, o) {
    var id = 'g' + (uid++);
    var dirs = { h: [0, 12, 24, 12], v: [12, 0, 12, 24], '45': [0, 0, 24, 24], '135': [0, 24, 24, 0] };
    var d = dirs[o.dir] || dirs['45'];
    var stops = '';
    gradStops(o).forEach(function (s) { stops += '<stop offset="' + s[0] + '" stop-color="' + s[1] + '"/>'; });
    var defs = '<defs><linearGradient id="' + id + '" x1="' + d[0] + '" y1="' + d[1] + '" x2="' + d[2] + '" y2="' + d[3] + '" gradientUnits="userSpaceOnUse">' + stops + '</linearGradient></defs>';
    var col = 'url(#' + id + ')';
    var body = '<path d="' + PLR + '" fill="' + col + '" stroke="' + col + '" stroke-width="2.4" stroke-linejoin="round"/>';
    if (o.glow) body = '<g style="filter:drop-shadow(0 0 6px ' + o.g3 + '99)">' + body + '</g>';
    return wrap(defs + body, size);
  }

  var FNAMES = [['fav','收藏'],['dl','下载'],['send','发送'],['quality','音质']];
  var TNAMES = [['order','顺序'],['prev','上一首'],['play','播放'],['next','下一首']];
  var NNAMES = [['home','首页'],['disc','播放'],['user','我的']];

  var SETS = [
    { n:'01', name:'经典粗描边', g:[['#8B5CF6','#D8B4FE','#FFAFCC','#9F7BFF','#DCC3FF','#FFB8D4']], tone:'flow', dir:'45', sw:3.0, cap:'round',
      spec:'3.0px 圆头描边 · 紫→粉 45° · 无容器', desc:'最基础也最稳的一套：加粗到 3px 的圆头描边，紫到粉的流光，背景完全留空。' },
    { n:'02', name:'柔紫描边', g:[['#8B5CF6','#D8B4FE','#FFAFCC','#9F7BFF','#DCC3FF','#FFB8D4']], tone:'purple', dir:'45', sw:3.0, cap:'round',
      spec:'3.0px 圆头描边 · 紫→淡紫 · 无容器', desc:'同线宽，仅收窄到紫→淡紫，最贴主色、最克制，和标题栏/开关同色系。' },
    { n:'03', name:'纵向流光', g:[['#8B5CF6','#D8B4FE','#FFAFCC','#9F7BFF','#DCC3FF','#FFB8D4']], tone:'flow', dir:'v', sw:3.0, cap:'round',
      spec:'3.0px 圆头描边 · 紫→粉 纵向 · 无容器', desc:'渐变改为自上而下，上紫下粉，和顶栏渐变方向一致，整体更协调。' },
    { n:'04', name:'三色流光', g:[['#8B5CF6','#D8B4FE','#FFAFCC','#9F7BFF','#DCC3FF','#FFB8D4']], tone:'trio', dir:'45', sw:3.2, cap:'round',
      spec:'3.2px 圆头描边 · 紫→淡紫→粉 三色 · 无容器', desc:'完整走模块三色流光（紫/淡紫/粉），描边加粗到 3.2px，层次最足。' },
    { n:'05', name:'超粗描边', g:[['#8B5CF6','#D8B4FE','#FFAFCC','#9F7BFF','#DCC3FF','#FFB8D4']], tone:'flow', dir:'45', sw:3.8, cap:'round',
      spec:'3.8px 超粗描边 · 紫→粉 · 无容器', desc:'直接把描边拉到 3.8px，图标更抢眼更「潮」，适合大屏与年轻化调性。' },
    { n:'06', name:'几何方角', g:[['#8B5CF6','#D8B4FE','#FFAFCC','#9F7BFF','#DCC3FF','#FFB8D4']], tone:'flow', dir:'45', sw:3.2, cap:'square',
      spec:'3.2px 方头方角描边 · 紫→粉 · 无容器', desc:'笔头与转角全改方形，几何利落、偏潮流机能风，仍然只有渐变描边。' },
    { n:'07', name:'微光描边', g:[['#8B5CF6','#D8B4FE','#FFAFCC','#9F7BFF','#DCC3FF','#FFB8D4']], tone:'flow', dir:'45', sw:3.0, cap:'round', glow:true,
      spec:'3.0px 圆头描边 + 柔光 · 紫→粉 · 无容器', desc:'描边外叠一层极淡粉光晕，暗色下尤其出彩，但依旧无任何底板。' },
    { n:'08', name:'双色叠影', g:[['#8B5CF6','#D8B4FE','#FFAFCC','#9F7BFF','#DCC3FF','#FFB8D4']], tone:'flow', dir:'45', sw:3.0, cap:'round', duo:true,
      spec:'3.0px 圆头描边 + 低透明叠影 · 紫→粉 · 无容器', desc:'描边后错位叠一层淡影，轻微立体未来感，颜色仍统一在模块紫粉内。' },
    { n:'09', name:'实心节点', g:[['#8B5CF6','#D8B4FE','#FFAFCC','#9F7BFF','#DCC3FF','#FFB8D4']], tone:'flow', dir:'45', sw:3.0, cap:'round', solid:true,
      spec:'3.0px 圆头描边 + 实心渐变旋钮 · 紫→粉 · 无容器', desc:'音质推子旋钮、碟心等节点改实心渐变，描边加粗，主次更清楚。' },
    { n:'10', name:'流光大播放', g:[['#8B5CF6','#D8B4FE','#FFAFCC','#9F7BFF','#DCC3FF','#FFB8D4']], tone:'flow', dir:'h', sw:3.0, cap:'round', glow:true, bigPlay:true,
      spec:'3.0px 横向描边 + 大号实心播放 · 紫→粉 · 无容器', desc:'传输行播放键放大为纯渐变实心三角（无圆底），配横向渐变描边，动感强。' }
  ];

  function themeOf(o, dark) {
    var p = o.g[0];
    return { g1: dark ? p[3] : p[0], g2: dark ? p[4] : p[1], g3: dark ? p[5] : p[2] };
  }
  function optsFor(o, dark) {
    var t = themeOf(o, dark);
    return { g1: t.g1, g2: t.g2, g3: t.g3, tone: o.tone, dir: o.dir, sw: o.sw, cap: o.cap, glow: o.glow, duo: o.duo, solid: o.solid };
  }
  function frow(o, dark) {
    var O = optsFor(o, dark);
    var s = '<div class="frow">';
    FNAMES.forEach(function (f) {
      s += '<button class="fbtn">' + icon(f[0], 24, O) + '<span class="fl">' + f[1] + '</span></button>';
    });
    return s + '</div>';
  }
  function trow(o, dark) {
    var O = optsFor(o, dark);
    var ps = o.bigPlay ? 30 : 26;
    return '<div class="trow">'
      + '<button class="tico torder">' + icon('order', 22, O) + '</button>'
      + '<button class="tico">' + icon('prev', 26, O) + '</button>'
      + '<button class="tplay">' + playIcon(ps, O) + '</button>'
      + '<button class="tico">' + icon('next', 26, O) + '</button>'
      + '</div>';
  }
  function eq(hs) { var s = '<div class="peq">'; for (var i = 0; i < hs.length; i++) s += '<i style="height:' + hs[i] + 'px;animation-delay:' + (i * 0.09).toFixed(2) + 's"></i>'; return s + '</div>'; }
  function nav(o, dark) {
    var O = optsFor(o, dark);
    var s = '<div class="nav">';
    NNAMES.forEach(function (n) {
      var active = n[0] === 'disc';
      var svg = active ? icon(n[0], 23, O) : wrap('<g fill="none" stroke="var(--t3)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">' + inner(n[0], 'fill="none" stroke="var(--t3)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"', null) + '</g>', 23);
      s += '<button class="ni' + (active ? ' on' : '') + '">' + svg + '<span class="nl">' + n[1] + '</span></button>';
    });
    return s + '</div>';
  }
  function phone(themeCls, o, dark) {
    return '<div class="phone ' + themeCls + '">'
      + '<div class="status"><span>9:41</span><span>&#9679;&#9679;&#9679;</span></div>'
      + '<div class="screen"><div class="pback">&#8592; 返回</div><div class="pgrow"></div>'
      + '<div class="pdisc"><span>&#9834;</span></div><div class="pgrow"></div>'
      + '<div class="ptitle">夜曲</div><div class="partist">周杰伦 · 十一月的萧邦</div><div class="pgrow"></div>'
      + eq([40,72,54,90,60,82,48,68,34,58]) + '<div class="pgrow"></div>'
      + '<div class="ptrack"><i></i></div><div class="ptimes"><span>01:24</span><span>03:51</span></div><div class="pgrow"></div>'
      + trow(o, dark) + '<div class="pgrow"></div>' + frow(o, dark)
      + '<div class="pgrow" style="flex:0 0 8px"></div>' + nav(o, dark) + '</div></div>';
  }
  function strip(themeCls, o, dark) {
    var O = optsFor(o, dark);
    var s = '<div class="strip ' + themeCls + '">';
    FNAMES.concat(TNAMES.slice(0, 1)).concat(TNAMES.slice(2)).forEach(function (f) {
      s += '<div class="cell">' + icon(f[0], 42, O) + '<div class="lb">' + f[1] + '</div></div>';
    });
    return s + '</div>';
  }

  var grid = document.getElementById('grid');
  SETS.forEach(function (o) {
    var box = document.createElement('div'); box.className = 'opt';
    box.innerHTML = '<div class="top"><div class="label"><b>' + o.n + '</b>' + o.name + '</div><div class="spec">' + o.spec + '</div></div><div class="desc">' + o.desc + '</div>'
      + '<div class="wrap"><div class="col"><div class="t">图标条 · 浅色</div>' + strip('th-light', o, false) + '</div>'
      + '<div class="col"><div class="t">图标条 · 暗色</div>' + strip('th-dark', o, true) + '</div></div>'
      + '<div class="wrap"><div class="col"><div class="t">实景 · 浅色</div>' + phone('th-light', o, false) + '</div>'
      + '<div class="col"><div class="t">实景 · 暗色</div>' + phone('th-dark', o, true) + '</div></div>';
    grid.appendChild(box);
  });

  document.getElementById('animBtn').onclick = function () { document.body.classList.toggle('paused'); this.textContent = document.body.classList.contains('paused') ? '播放动画' : '暂停动画'; };
  document.getElementById('pageBtn').onclick = function () { document.body.classList.toggle('darkpage'); this.textContent = document.body.classList.contains('darkpage') ? '页面浅色' : '页面暗色'; };
})();
</script>
</body>
</html>
