<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>歌单/歌曲图标 · 实心节点 10 套</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root { --page1:#FBF9FF; --page2:#F1EAFE; --ink:#2A2340; --ink2:#6F6389; }
  body.darkpage { --page1:#150F1E; --page2:#100A18; --ink:#F2ECFB; --ink2:#B6A6D1; }
  body { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--ink);
    min-height: 100vh; padding: 26px 16px 90px; background: linear-gradient(180deg, var(--page1), var(--page2)) fixed; }
  .head { max-width: 1520px; margin: 0 auto; }
  .head h1 { font-size: 23px; }
  .head h1 em { font-style: normal; background: linear-gradient(92deg, #8B5CF6, #D8B4FE, #FFAFCC); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .head p { font-size: 12.5px; color: var(--ink2); margin-top: 9px; line-height: 1.95; max-width: 1180px; }
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 14px; background: rgba(255,255,255,.72);
    border: 1px solid rgba(139,92,246,.16); border-radius: 16px; padding: 11px 14px; max-width: 1180px; box-shadow: 0 10px 24px rgba(96,66,160,.08); backdrop-filter: blur(8px); }
  body.darkpage .bar { background: rgba(36,27,56,.82); border-color: rgba(159,123,255,.22); }
  .bar button { border: none; cursor: pointer; font-weight: 800; font-size: 12.5px; color: #fff; background: linear-gradient(135deg, #8B5CF6, #FFAFCC); padding: 9px 16px; border-radius: 11px; }
  .bar .tag { font-size: 12px; color: var(--ink2); font-weight: 700; }

  .grid { max-width: 1520px; margin: 28px auto 0; display: flex; flex-direction: column; gap: 46px; }
  .opt { display: flex; flex-direction: column; gap: 14px; }
  .top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .label { font-size: 15px; font-weight: 900; }
  .label b { font-size: 11px; color: #fff; background: linear-gradient(135deg, #8B5CF6, #FFAFCC); padding: 3px 9px; border-radius: 999px; margin-right: 9px; }
  .spec { font-size: 12px; font-weight: 700; color: #8B5CF6; }
  .desc { font-size: 12px; color: var(--ink2); line-height: 1.7; }
  .wrap { display: flex; gap: 30px; flex-wrap: wrap; align-items: flex-start; }
  .col { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .col > .t { font-size: 11px; font-weight: 800; color: var(--ink2); letter-spacing: .5px; }

  .th-light { --bg:#FBF9FF; --bg2:#F1EAFE; --card:#FFFFFF; --t1:#2A2340; --t2:#6F6389; --t3:#9A8CB8; --line:#DCCFF2; --chip:#ECE3FB; --g1:#8B5CF6; --g2:#D8B4FE; --g3:#FFAFCC; }
  .th-dark  { --bg:#150F1E; --bg2:#100A18; --card:#241B38; --t1:#F2ECFB; --t2:#B6A6D1; --t3:#8A79A8; --line:#3B2F55; --chip:#2A2040; --g1:#9F7BFF; --g2:#DCC3FF; --g3:#FFB8D4; }

  .strip { border-radius: 18px; padding: 14px 8px 10px; display: flex; gap: 2px; width: 400px; background: transparent; }
  .strip .cell { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .strip .cell .lb { font-size: 9px; color: var(--t3); font-weight: 700; }
  .strip .cell svg { display: block; }

  .phone { width: 390px; height: 844px; border-radius: 44px; overflow: hidden; position: relative; box-shadow: 0 22px 52px rgba(60,40,110,.24), 0 0 0 9px rgba(18,11,28,.86); }
  .phone.dark { box-shadow: 0 22px 52px rgba(0,0,0,.6), 0 0 0 9px rgba(0,0,0,.9); }
  .status { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 26px; font-size: 12.5px; font-weight: 800; color: var(--t1); }
  .screen { position: absolute; inset: 44px 0 0 0; display: flex; flex-direction: column; padding: 0 20px; color: var(--t1); background: linear-gradient(180deg, var(--bg), var(--bg2)); }
  .pback { font-size: 13px; font-weight: 800; color: #8B5CF6; padding-top: 6px; }
  .ptitle { text-align: center; font-size: 18px; font-weight: 900; margin-top: 2px; }
  .cats { display: flex; justify-content: space-between; margin: 14px 2px 4px; }
  .cat { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .cat .cl { font-size: 10.5px; font-weight: 700; color: var(--t3); }
  .cat.on .cl { color: var(--t1); font-weight: 900; }
  .sec { font-size: 12px; font-weight: 900; color: var(--t2); margin: 14px 2px 2px; }
  .rows { flex: 1; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 2px; border-bottom: 1px solid var(--line); }
  .row .lead { width: 30px; display: grid; place-items: center; }
  .row .meta { flex: 1; min-width: 0; }
  .row .rt { font-weight: 800; font-size: 13.5px; color: var(--t1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .ra { font-size: 11px; color: var(--t2); margin-top: 2px; }
  .row.cur .rt { color: #8B5CF6; }
  .row .act { display: flex; gap: 15px; color: var(--t3); }

  .nav { display: flex; align-items: center; margin: 0 -20px; padding: 12px 8px 14px; background: transparent; border-top: 1px solid var(--line); }
  .ni { flex: 1; appearance: none; border: 0; background: transparent; font: inherit; color: var(--t3); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 3px 0; }
  .ni .nl { font-size: 10px; }
  .ni.on .nl { font-weight: 800; color: var(--t1); }
</style>
</head>
<body>
<div class="head">
  <h1>歌单 / 歌曲图标 · <em>实心节点 10 套</em></h1>
  <p>延续已锁定的<b>实心节点</b>基调：模块「葡萄气泡」三色渐变描边、粗线、实心节点、<b>无背景容器</b>。本组图标覆盖 歌曲 / 专辑 / 歌手 / 歌单 / 播放中 / 更多 / 下载 / 收藏 / 搜索 / 导入，10 套只在描边宽、渐变朝向、笔角与节点大小上区分，浅暗双适配。</p>
  <div class="bar">
    <span class="tag">下方实景为「在线音乐」搜索结果页</span>
    <button id="pageBtn">页面暗色</button>
  </div>
</div>
<div class="grid" id="grid"></div>

<script>
(function () {
  var HEART='M12 19.9C12 19.9 4.3 15.2 4.3 10a3.9 3.9 0 0 1 7.7-1.6A3.9 3.9 0 0 1 19.7 10c0 5.2-7.7 9.9-7.7 9.9Z';

  function wrap(inner, size) {
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">' + inner + '</svg>';
  }
  var uid = 0;
  // S=描边属性, col=当前渐变 url, solid=节点是否实心, node=节点半径倍率
  function inner(name, S, col, solid, node) {
    function P(d) { return '<path d="' + d + '" ' + S + '/>'; }
    function C(x, y, r, forceSolid) {
      var sf = forceSolid || solid;
      return '<circle cx="' + x + '" cy="' + y + '" r="' + (r * (node || 1)).toFixed(2) + '" ' + (sf ? 'fill="' + col + '" stroke="none"' : S) + '/>';
    }
    switch (name) {
      case 'note': return P('M9.7 17.6V7.1') + P('M19 16V5.5') + P('M9.7 7.1 19 5.5') + C(7.4, 17.6, 2.3) + C(16.7, 16, 2.3);
      case 'album': return C(12, 12, 8.1) + C(12, 12, 2.3);
      case 'mic': return P('M12 4.2a2.7 2.7 0 0 1 2.7 2.7v4.5a2.7 2.7 0 0 1-5.4 0V6.9A2.7 2.7 0 0 1 12 4.2Z')
        + P('M6.8 11.2a5.2 5.2 0 0 0 10.4 0') + P('M12 16.4v3.4') + P('M9 19.8h6');
      case 'playlist': return P('M4 6.4h10') + P('M4 10.7h8') + P('M4 15h5.4') + P('M18.9 15.7V8.5') + C(16.7, 15.7, 2.2);
      case 'eq': return P('M6.4 10.1v3.8') + P('M12 6.2v11.6') + P('M17.6 8.5v6.9');
      case 'more': return C(6, 12, 1.8, true) + C(12, 12, 1.8, true) + C(18, 12, 1.8, true);
      case 'dl': return P('M12 3.9v9.6') + P('M7.8 9.6 12 13.8 16.2 9.6') + P('M5.4 19.4h13.2');
      case 'fav': return P(HEART);
      case 'search': return C(11, 11, 5.7) + P('M15.4 15.4 20 20');
      case 'import': return P('M9.4 14.6 14.6 9.4')
        + P('M8 11.9 6.5 13.4a2.9 2.9 0 0 0 4.1 4.1l1.5-1.5')
        + P('M16 12.1l1.5-1.5a2.9 2.9 0 0 0-4.1-4.1l-1.5 1.5');
      case 'home': return P('M4 11 12 4.1l8 6.9') + P('M6.2 9.6V19a1 1 0 0 0 1 1h9.6a1 1 0 0 0 1-1V9.6');
      case 'disc': return C(12, 12, 8.2) + C(12, 12, 2.3);
      case 'user': return C(12, 8.3, 3.9) + P('M4.8 19.9a7.2 7.2 0 0 1 14.4 0');
    }
    return '';
  }
  function stopsOf(o) {
    var a = o.g1, b = o.g3, m = o.g2;
    if (o.tone === 'purple') return [['0', a], ['1', m]];
    if (o.tone === 'trio') return [['0', a], ['.5', m], ['1', b]];
    if (o.tone === 'reverse') return [['0', b], ['1', a]];
    return [['0', a], ['1', b]];
  }
  var DIRS = { h: [0, 12, 24, 12], v: [12, 0, 12, 24], '45': [0, 0, 24, 24], '135': [0, 24, 24, 0] };
  function icon(name, size, o) {
    var id = 'g' + (uid++), d = DIRS[o.dir] || DIRS['45'], stops = '';
    stopsOf(o).forEach(function (s) { stops += '<stop offset="' + s[0] + '" stop-color="' + s[1] + '"/>'; });
    var defs = '<defs><linearGradient id="' + id + '" x1="' + d[0] + '" y1="' + d[1] + '" x2="' + d[2] + '" y2="' + d[3] + '" gradientUnits="userSpaceOnUse">' + stops + '</linearGradient></defs>';
    var col = 'url(#' + id + ')';
    var capJoin = o.cap === 'square' ? ' stroke-linecap="square" stroke-linejoin="miter"' : ' stroke-linecap="round" stroke-linejoin="round"';
    var S = 'fill="none" stroke="' + col + '" stroke-width="' + o.sw + '"' + capJoin;
    var core = inner(name, S, col, o.solid, o.node);
    if (o.duo) core = '<g transform="translate(1.2,1.2)" opacity=".26">' + inner(name, S, col, o.solid, o.node) + '</g>' + core;
    if (o.glow) core = '<g style="filter:drop-shadow(0 0 3.5px ' + o.g3 + 'aa)">' + core + '</g>';
    return wrap(defs + core, size);
  }
  function muted(name, o) {
    var S = 'fill="none" stroke="var(--t3)" stroke-width="' + (o.sw * 0.8) + '" stroke-linecap="round" stroke-linejoin="round"';
    return wrap(inner(name, S, 'var(--t3)', false, o.node), 22);
  }

  var CATS = [['note', '歌曲'], ['album', '专辑'], ['mic', '歌手'], ['playlist', '歌单']];
  var ACTS = [['dl', '下载'], ['fav', '收藏'], ['more', '更多']];
  var STRIP = [['note','歌曲'],['album','专辑'],['mic','歌手'],['playlist','歌单'],['eq','播放中']];
  var STRIP2 = [['search','搜索'],['import','导入'],['dl','下载'],['fav','收藏'],['more','更多']];
  var NAV = [['home', '首页'], ['disc', '播放'], ['user', '我的']];
  var SONGS = [['夜曲', '周杰伦 · 十一月的萧邦', true], ['稻香', '周杰伦 · 魔杰座', false],
    ['晴天', '周杰伦 · 叶惠美', false], ['七里香', '周杰伦 · 七里香', false],
    ['告白气球', '周杰伦 · 周杰伦的床边故事', false], ['明明就', '周杰伦 · 十二新作', false]];

  var SETS = [
    { n:'01', name:'实心节点 · 基准', p:['#8B5CF6','#D8B4FE','#FFAFCC','#9F7BFF','#DCC3FF','#FFB8D4'], tone:'flow', dir:'45', sw:3.0, solid:true,
      spec:'3.0px 圆头 · 紫→粉 45° · 实心节点', desc:'锁定款的标准形态：3px 圆头渐变描边 + 实心节点，做歌单/歌曲图标的基准。' },
    { n:'02', name:'实心节点 · 小节点', p:['#8B5CF6','#D8B4FE','#FFAFCC','#9F7BFF','#DCC3FF','#FFB8D4'], tone:'flow', dir:'45', sw:3.0, solid:true, node:0.82,
      spec:'3.0px 圆头 · 紫→粉 · 节点收小', desc:'节点半径收 18%，音符头/碟心更精致，适合密集列表小尺寸。' },
    { n:'03', name:'实心节点 · 大节点', p:['#8B5CF6','#D8B4FE','#FFAFCC','#9F7BFF','#DCC3FF','#FFB8D4'], tone:'flow', dir:'45', sw:3.0, solid:true, node:1.22,
      spec:'3.0px 圆头 · 紫→粉 · 节点放大', desc:'节点放大 22%，视觉重心更重、更抢眼，适合大屏与播放中状态。' },
    { n:'04', name:'实心节点 · 柔紫', p:['#8B5CF6','#D8B4FE','#FFAFCC','#9F7BFF','#DCC3FF','#FFB8D4'], tone:'purple', dir:'45', sw:3.0, solid:true,
      spec:'3.0px 圆头 · 紫→淡紫 · 实心节点', desc:'渐变收窄到紫→淡紫，最贴主色，与标题栏/开关同色，克制统一。' },
    { n:'05', name:'实心节点 · 三色', p:['#8B5CF6','#D8B4FE','#FFAFCC','#9F7BFF','#DCC3FF','#FFB8D4'], tone:'trio', dir:'45', sw:3.1, solid:true,
      spec:'3.1px 圆头 · 三色流光 · 实心节点', desc:'完整三色（紫/淡紫/粉）流光，最接近模块 FlowingGradient 原色。' },
    { n:'06', name:'实心节点 · 纵向', p:['#8B5CF6','#D8B4FE','#FFAFCC','#9F7BFF','#DCC3FF','#FFB8D4'], tone:'flow', dir:'v', sw:3.0, solid:true,
      spec:'3.0px 圆头 · 纵向 紫→粉 · 实心节点', desc:'上紫下粉的纵向渐变，与顶栏方向一致，整屏更协调。' },
    { n:'07', name:'实心节点 · 微光', p:['#8B5CF6','#D8B4FE','#FFAFCC','#9F7BFF','#DCC3FF','#FFB8D4'], tone:'flow', dir:'45', sw:3.0, solid:true, glow:true,
      spec:'3.0px 圆头 + 柔光 · 紫→粉 · 实心节点', desc:'描边外极淡粉光晕，暗色下更亮眼，仍无任何底板。' },
    { n:'08', name:'实心节点 · 叠影', p:['#8B5CF6','#D8B4FE','#FFAFCC','#9F7BFF','#DCC3FF','#FFB8D4'], tone:'flow', dir:'45', sw:3.0, solid:true, duo:true,
      spec:'3.0px 圆头 + 低透明叠影 · 紫→粉 · 实心节点', desc:'错位叠一层淡影，轻微立体未来感，颜色仍统一在模块紫粉内。' },
    { n:'09', name:'实心节点 · 方角', p:['#8B5CF6','#D8B4FE','#FFAFCC','#9F7BFF','#DCC3FF','#FFB8D4'], tone:'flow', dir:'45', sw:3.1, solid:true, cap:'square',
      spec:'3.1px 方头方角 · 紫→粉 · 实心节点', desc:'笔头转角改方形，几何机能风，列表更利落。' },
    { n:'10', name:'实心节点 · 加粗', p:['#8B5CF6','#D8B4FE','#FFAFCC','#9F7BFF','#DCC3FF','#FFB8D4'], tone:'flow', dir:'45', sw:3.6, solid:true,
      spec:'3.6px 超粗圆头 · 紫→粉 · 实心节点', desc:'描边拉到 3.6px，图标更醒目更年轻化，适合作为强调款。' }
  ];

  function optsFor(o, dark) {
    var p = o.p;
    return { g1: dark ? p[3] : p[0], g2: dark ? p[4] : p[1], g3: dark ? p[5] : p[2],
      tone: o.tone, dir: o.dir, sw: o.sw, cap: o.cap, glow: o.glow, duo: o.duo, solid: o.solid, node: o.node || 1 };
  }
  function cats(o, dark) {
    var O = optsFor(o, dark), s = '<div class="cats">';
    CATS.forEach(function (c, i) {
      s += '<div class="cat' + (c[0] === 'note' ? ' on' : '') + '">' + icon(c[0], 24, O) + '<div class="cl">' + c[1] + '</div></div>';
    });
    return s + '</div>';
  }
  function rows(o, dark) {
    var O = optsFor(o, dark), s = '<div class="rows">';
    SONGS.forEach(function (sg) {
      var lead = sg[2] ? icon('eq', 22, O) : muted('note', O);
      s += '<div class="row' + (sg[2] ? ' cur' : '') + '"><div class="lead">' + lead + '</div>'
        + '<div class="meta"><div class="rt">' + sg[0] + '</div><div class="ra">' + sg[1] + '</div></div>'
        + '<div class="act">' + icon('dl', 19, O) + icon('more', 19, O) + '</div></div>';
    });
    return s + '</div>';
  }
  function nav(o, dark) {
    var O = optsFor(o, dark), s = '<div class="nav">';
    NAV.forEach(function (n) {
      var active = n[0] === 'disc';
      var svg = active ? icon(n[0], 23, O) : muted(n[0], O);
      s += '<button class="ni' + (active ? ' on' : '') + '">' + svg + '<span class="nl">' + n[1] + '</span></button>';
    });
    return s + '</div>';
  }
  function phone(themeCls, o, dark) {
    return '<div class="phone ' + themeCls + '">'
      + '<div class="status"><span>9:41</span><span>&#9679;&#9679;&#9679;</span></div>'
      + '<div class="screen"><div class="pback">&#8592; 返回</div><div class="ptitle">在线音乐</div>'
      + cats(o, dark) + '<div class="sec">搜索结果 · 歌曲</div>' + rows(o, dark) + nav(o, dark) + '</div></div>';
  }
  function strip(themeCls, names, o, dark) {
    var O = optsFor(o, dark), s = '<div class="strip ' + themeCls + '">';
    names.forEach(function (f) { s += '<div class="cell">' + icon(f[0], 38, O) + '<div class="lb">' + f[1] + '</div></div>'; });
    return s + '</div>';
  }

  var grid = document.getElementById('grid');
  SETS.forEach(function (o) {
    var box = document.createElement('div'); box.className = 'opt';
    box.innerHTML = '<div class="top"><div class="label"><b>' + o.n + '</b>' + o.name + '</div><div class="spec">' + o.spec + '</div></div><div class="desc">' + o.desc + '</div>'
      + '<div class="wrap"><div class="col"><div class="t">分类+播放中 · 浅色</div>' + strip('th-light', STRIP, o, false) + '</div>'
      + '<div class="col"><div class="t">分类+播放中 · 暗色</div>' + strip('th-dark', STRIP, o, true) + '</div></div>'
      + '<div class="wrap"><div class="col"><div class="t">操作图标 · 浅色</div>' + strip('th-light', STRIP2, o, false) + '</div>'
      + '<div class="col"><div class="t">操作图标 · 暗色</div>' + strip('th-dark', STRIP2, o, true) + '</div></div>'
      + '<div class="wrap"><div class="col"><div class="t">实景 · 浅色</div>' + phone('th-light', o, false) + '</div>'
      + '<div class="col"><div class="t">实景 · 暗色</div>' + phone('th-dark', o, true) + '</div></div>';
    grid.appendChild(box);
  });

  document.getElementById('pageBtn').onclick = function () { document.body.classList.toggle('darkpage'); this.textContent = document.body.classList.contains('darkpage') ? '页面浅色' : '页面暗色'; };
})();
</script>
</body>
</html>
