<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>播放器图标 · 潮流渐变描边 10 套</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root { --page1:#F7F5FC; --page2:#EFEAF8; --ink:#241E36; --ink2:#6C6584; }
  body.darkpage { --page1:#0E0B16; --page2:#151022; --ink:#ECE8F7; --ink2:#A79FC0; }
  body { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--ink);
    min-height: 100vh; padding: 26px 16px 90px; background: linear-gradient(180deg, var(--page1), var(--page2)) fixed; }
  .head { max-width: 1520px; margin: 0 auto; }
  .head h1 { font-size: 23px; }
  .head h1 em { font-style: normal; background: linear-gradient(92deg, #8B5CF6, #EC4899); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .head p { font-size: 12.5px; color: var(--ink2); margin-top: 9px; line-height: 1.95; max-width: 1180px; }
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 14px; background: rgba(255,255,255,.72);
    border: 1px solid rgba(139,92,246,.16); border-radius: 16px; padding: 11px 14px; max-width: 1180px; box-shadow: 0 10px 24px rgba(96,66,160,.08); backdrop-filter: blur(8px); }
  body.darkpage .bar { background: rgba(28,21,45,.82); border-color: rgba(159,123,255,.22); }
  .bar button { border: none; cursor: pointer; font-weight: 800; font-size: 12.5px; color: #fff; background: linear-gradient(135deg, #7C5CFF, #EC4899); padding: 9px 16px; border-radius: 11px; }
  .bar .tag { font-size: 12px; color: var(--ink2); font-weight: 700; }

  .grid { max-width: 1520px; margin: 28px auto 0; display: flex; flex-direction: column; gap: 44px; }
  .opt { display: flex; flex-direction: column; gap: 14px; }
  .top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .label { font-size: 15px; font-weight: 900; }
  .label b { font-size: 11px; color: #fff; background: linear-gradient(135deg, #7C5CFF, #EC4899); padding: 3px 9px; border-radius: 999px; margin-right: 9px; }
  .spec { font-size: 12px; font-weight: 700; color: #8B5CF6; }
  .desc { font-size: 12px; color: var(--ink2); line-height: 1.7; }
  .wrap { display: flex; gap: 30px; flex-wrap: wrap; align-items: flex-start; }
  .col { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .col > .t { font-size: 11px; font-weight: 800; color: var(--ink2); letter-spacing: .5px; }

  .th-light { --bg:#F8F6FD; --bg2:#EFEAF8; --card:#FFFFFF; --t1:#241E36; --t2:#6C6584; --line:#ECE6F7; --chip:#F2EDFB; --ong:#fff; --shadow:0 14px 34px rgba(80,56,150,.14); }
  .th-dark { --bg:#0F0B18; --bg2:#161124; --card:#1B1430; --t1:#ECE8F7; --t2:#A79FC0; --line:#2A2142; --chip:#221A38; --ong:#fff; --shadow:0 14px 34px rgba(0,0,0,.5); }

  .strip { border-radius: 18px; padding: 12px 10px 9px; display: flex; gap: 4px; width: 390px; background: linear-gradient(180deg, var(--bg), var(--bg2)); border: 1px solid var(--line); }
  .strip .cell { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .strip .cell .lb { font-size: 9.5px; color: var(--t2); }
  .strip .cell svg { display: block; }

  .phone { width: 390px; height: 844px; border-radius: 44px; overflow: hidden; position: relative; box-shadow: 0 22px 52px rgba(60,40,110,.24), 0 0 0 9px rgba(18,11,28,.86); }
  .phone.dark { box-shadow: 0 22px 52px rgba(0,0,0,.6), 0 0 0 9px rgba(0,0,0,.9); }
  .status { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 26px; font-size: 12.5px; font-weight: 800; color: var(--t1); }
  .screen { position: absolute; inset: 44px 0 0 0; display: flex; flex-direction: column; padding: 0 20px; color: var(--t1); background: linear-gradient(180deg, var(--bg), var(--bg2)); }
  .pgrow { flex: 1; min-height: 2px; }
  .pback { font-size: 13px; font-weight: 800; color: #8B5CF6; padding-top: 6px; }
  .ptitle { text-align: center; font-size: 20px; font-weight: 900; }
  .partist { text-align: center; font-size: 12.5px; color: var(--t2); margin-top: 4px; }
  .pdisc { width: 158px; height: 158px; margin: 0 auto; border-radius: 50%; position: relative;
    background: radial-gradient(circle at 34% 30%, #D8B4FE, #EC4899 46%, #7C5CFF 82%);
    box-shadow: 0 18px 40px rgba(120,80,200,.3), inset 0 0 0 12px rgba(255,255,255,.1); }
  .pdisc::before { content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, rgba(255,255,255,0), rgba(255,255,255,.32), rgba(255,255,255,0) 40%, rgba(255,255,255,.16) 70%, rgba(255,255,255,0));
    animation: spin 7s linear infinite; }
  .pdisc span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 28px; color: #fff; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .peq { display: flex; align-items: flex-end; justify-content: center; gap: 6px; height: 96px; }
  .peq i { width: 7px; border-radius: 6px 6px 3px 3px; background: linear-gradient(180deg, #C4B5FD, #8B5CF6, #EC4899); animation: bump 1.05s ease-in-out infinite; }
  @keyframes bump { 0%,100% { transform: scaleY(.28); } 50% { transform: scaleY(1); } }
  .ptrack { height: 5px; border-radius: 999px; background: var(--chip); overflow: hidden; }
  .ptrack > i { display: block; height: 100%; width: 40%; border-radius: 999px; background: linear-gradient(90deg, #7C5CFF, #EC4899); }
  .ptimes { display: flex; justify-content: space-between; font-size: 11px; color: var(--t2); margin-top: 6px; font-variant-numeric: tabular-nums; }

  .frow { display: flex; align-items: center; justify-content: space-around; gap: 6px; }
  .fbtn { appearance: none; border: 0; background: transparent; font: inherit; color: var(--t2); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 7px 4px; position: relative; }
  .fbtn .fl { font-size: 10px; }
  .frow.capsule, .frow.float { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 8px 8px; }
  .frow.float { box-shadow: var(--shadow); }
  .frow.glass { background: linear-gradient(135deg, rgba(255,255,255,.6), rgba(255,255,255,.24)); border: 1px solid rgba(255,255,255,.6); border-radius: 19px; padding: 8px 8px; backdrop-filter: blur(14px); }
  .th-dark .frow.glass { background: linear-gradient(135deg, rgba(120,90,200,.22), rgba(60,40,110,.18)); border-color: rgba(190,160,255,.22); }
  .frow.tiles { gap: 8px; }
  .frow.tiles .fbtn { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 11px 0; }
  .frow.segment { background: var(--chip); border-radius: 15px; padding: 4px; gap: 3px; }
  .frow.segment .fbtn { flex: 1; flex-direction: row; justify-content: center; gap: 6px; padding: 11px 4px; border-radius: 11px; }
  .frow.segment .fbtn.active { background: linear-gradient(135deg, var(--ga), var(--gb)); box-shadow: 0 8px 18px rgba(139,92,246,.32); }
  .frow.segment .fbtn.active .fl { color: #fff; font-weight: 800; }
  .frow.underline .fbtn::after { content: ""; position: absolute; left: 50%; transform: translateX(-50%); bottom: 2px; width: 18px; height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--ga), var(--gb)); }

  .trow { display: flex; align-items: center; justify-content: center; gap: 30px; position: relative; }
  .tico { appearance: none; border: 0; background: transparent; cursor: pointer; color: var(--t1); display: grid; place-items: center; padding: 4px; }
  .torder { position: absolute; left: 0; }
  .tplay { width: 64px; height: 64px; border: 0; cursor: pointer; display: grid; place-items: center; border-radius: 50%;
    background: linear-gradient(135deg, var(--ga), var(--gb)); box-shadow: 0 12px 26px rgba(124,92,255,.4); }
  .tplay.squircle { border-radius: 20px; }
  .tplay.glow { box-shadow: 0 0 26px rgba(236,72,153,.6), 0 12px 26px rgba(124,92,255,.4); }
  .tplay.ring { background: linear-gradient(var(--bg), var(--bg)) padding-box, linear-gradient(135deg, var(--ga), var(--gb)) border-box; border: 2.5px solid transparent; box-shadow: none; }

  .nav { display: flex; align-items: center; margin: 0 -20px; padding: 10px 8px 13px; background: var(--card); border-top: 1px solid var(--line); }
  .ni { flex: 1; appearance: none; border: 0; background: transparent; font: inherit; color: var(--t2); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 3px 0; }
  .ni .nl { font-size: 10px; }
  .ni.on .nl { font-weight: 800; }

  .paused .pdisc::before, .paused .peq i { animation-play-state: paused; }
</style>
</head>
<body>
<div class="head">
  <h1>播放器图标 · <em>潮流渐变描边 10 套</em></h1>
  <p>统一使用同一套精修线性图标（心形 / 下载 / 纸飞机 / 调音推子 / 循环 / 上一首 / 播放 / 下一首），全部改为<b>低饱和双色渐变描边</b>，不玩花哨造型。10 套只通过「渐变配色 + 容器 + 播放键」区分，克制、耐看。</p>
  <div class="bar">
    <span class="tag">放大图标条可逐套比对</span>
    <button id="animBtn">暂停动画</button>
    <button id="pageBtn">页面暗色</button>
  </div>
</div>
<div class="grid" id="grid"></div>

<script>
(function () {
  var FAV='M12 19.9C12 19.9 4.3 15.2 4.3 10a3.9 3.9 0 0 1 7.7-1.6A3.9 3.9 0 0 1 19.7 10c0 5.2-7.7 9.9-7.7 9.9Z';
  var PLANE='M20.5 4.1 3.9 11.2l6.6 2.1 2.2 6.6L20.5 4.1Z', PLANE_F='M10.5 13.3 20.5 4.1';
  var RA='M4 10a4.6 4.6 0 0 1 4.6-4.6H17', RAH='M14.6 2.9 17.7 5.4 14.6 7.9', RB='M20 14a4.6 4.6 0 0 1-4.6 4.6H7', RBH='M9.4 21.1 6.3 18.6 9.4 16.1';
  var PLR='M8.2 5.4c0-.92 1.02-1.46 1.76-.93l8.7 6.5c.6.45.6 1.36 0 1.81l-8.7 6.5c-.74.53-1.76 0-1.76-.93z';

  function wrap(inner, size) {
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">' + inner + '</svg>';
  }
  var uid = 0;
  function paths(name, col, sw) {
    var s = 'fill="none" stroke="' + col + '" stroke-width="' + sw + '" stroke-linecap="round" stroke-linejoin="round"';
    var P = function (d) { return '<path d="' + d + '" ' + s + '/>'; };
    var C = function (x, y, r) { return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" ' + s + '/>'; };
    switch (name) {
      case 'fav': return P(FAV);
      case 'dl': return P('M12 4.2v9.6') + P('M7.9 9.9 12 14 16.1 9.9') + P('M5.6 19.2h12.8');
      case 'send': return P(PLANE) + P(PLANE_F);
      case 'quality': return P('M5 8.2h14') + P('M5 15.8h14') + C(9.4, 8.2, 2.3) + C(14.6, 15.8, 2.3);
      case 'order': return P(RA) + P(RAH) + P(RB) + P(RBH);
      case 'prev': return P('M6 5.7v12.6') + P('M18 5.7 8.8 12 18 18.3Z');
      case 'next': return P('M18 5.7v12.6') + P('M6 5.7 15.2 12 6 18.3Z');
      case 'play': return P(PLR);
      case 'home': return P('M4 11 12 4.2l8 6.8') + P('M6.3 9.7V19a1 1 0 0 0 1 1h9.4a1 1 0 0 0 1-1V9.7');
      case 'disc': return C(12, 12, 8.1) + C(12, 12, 2.4);
      case 'user': return C(12, 8.4, 3.8) + P('M4.9 19.9a7.1 7.1 0 0 1 14.2 0');
    }
    return '';
  }
  // 渐变描边图标；opts: {a,b,x1,y1,x2,y2,sw,glow,duo,white}
  function icon(name, size, o) {
    var id = 'g' + (uid++);
    if (o.white) return wrap(paths(name, '#fff', o.sw), size);
    var stops = '<stop offset="0" stop-color="' + o.a + '"/><stop offset="1" stop-color="' + o.b + '"/>';
    var defs = '<defs><linearGradient id="' + id + '" x1="' + o.x1 + '" y1="' + o.y1 + '" x2="' + o.x2 + '" y2="' + o.y2 + '" gradientUnits="userSpaceOnUse">' + stops + '</linearGradient></defs>';
    var col = 'url(#' + id + ')';
    var core = paths(name, col, o.sw);
    if (o.duo) core = '<g transform="translate(1.1,1.1)" opacity=".3">' + paths(name, o.b, o.sw) + '</g>' + core;
    if (o.glow) core = '<g style="filter:drop-shadow(0 0 4px ' + o.b + 'aa)">' + core + '</g>';
    return wrap(defs + core, size);
  }
  function playIcon(size, o) {
    if (o.playOutline) {
      var id = 'g' + (uid++);
      var stops = '<stop offset="0" stop-color="' + o.a + '"/><stop offset="1" stop-color="' + o.b + '"/>';
      var defs = '<defs><linearGradient id="' + id + '" x1="' + o.x1 + '" y1="' + o.y1 + '" x2="' + o.x2 + '" y2="' + o.y2 + '" gradientUnits="userSpaceOnUse">' + stops + '</linearGradient></defs>';
      return wrap(defs + paths('play', 'url(#' + id + ')', o.sw + 0.2), size);
    }
    return wrap('<path d="' + PLR + '" fill="#fff"/>', size);
  }

  var FNAMES = [['fav','收藏'],['dl','下载'],['send','发送'],['quality','音质']];
  var TNAMES = [['order','顺序'],['prev','上一首'],['play','播放'],['next','下一首']];
  var NNAMES = [['home','首页'],['disc','播放'],['user','我的']];

  var SETS = [
    { n:'01', name:'极细描边', g:['#8B5CF6','#EC4899'], sw:1.6, dir:'45', frow:'', play:'ring',
      spec:'1.6px 细描边 · 紫→粉 · 无容器 · 播放键渐变圆环', desc:'最克制的一套，细线克制、留白充足，紫色到玫粉的经典流光，耐看不过时。' },
    { n:'02', name:'圆角胶囊', g:['#6366F1','#38BDF8'], sw:2.0, dir:'h', frow:'capsule', play:'circle',
      spec:'2px 描边 · 靛→天蓝 · 功能行浅色胶囊 · 播放键实心渐变圆', desc:'功能行收进一枚圆角胶囊，秩序感强；靛蓝到天蓝冷静专业。' },
    { n:'03', name:'磨砂玻璃', g:['#06B6D4','#2DD4BF'], sw:2.0, dir:'45', frow:'glass', play:'ring',
      spec:'2px 描边 · 青→薄荷 · 玻璃容器 · 播放键渐变圆环', desc:'磨砂玻璃容器配青绿渐变，通透干净，暗色下尤其高级。' },
    { n:'04', name:'圆角方砖', g:['#A855F7','#6366F1'], sw:2.1, dir:'45', frow:'tiles', play:'squircle',
      spec:'2.1px 描边 · 紫→靛 · 4 个发丝边框小砖 · 播放键圆角方', desc:'每项独立成圆角砖，紫到靛过渡沉稳，分区清楚。' },
    { n:'05', name:'柔光描边', g:['#F472B6','#A78BFA'], sw:1.9, dir:'45', frow:'', play:'glow', playOutline:false,
      spec:'1.9px 描边 + 柔光 · 玫→薰衣草 · 播放键外发光', desc:'描边外一层极淡光晕，玫粉转薰衣草，温柔有质感。' },
    { n:'06', name:'下划线点缀', g:['#0EA5E9','#6366F1'], sw:2.0, dir:'h', frow:'underline', play:'circle',
      spec:'2px 描边 · 海蓝→靛 · 每项下方渐变短线 · 播放键实心圆', desc:'图标下加一条渐变短线做落点，海蓝到靛，清爽利落。' },
    { n:'07', name:'叠影描边', g:['#34D399','#3B82F6'], sw:1.8, dir:'45', frow:'', play:'ring', duo:true,
      spec:'1.8px 描边 + 淡叠影 · 薄荷→蓝 · 播放键渐变圆环', desc:'描边后一层低透明叠影，薄荷到蓝，轻微未来感但不吵。' },
    { n:'08', name:'粗线描边', g:['#E879F9','#818CF8'], sw:2.6, dir:'45', frow:'', play:'circle',
      spec:'2.6px 粗描边 · 品红→靛 · 无容器 · 播放键加大实心圆', desc:'加粗描边力量感强，品红到靛对比鲜明，适合大屏。' },
    { n:'09', name:'分段控件', g:['#22D3EE','#818CF8'], sw:2.0, dir:'45', frow:'segment', play:'squircle',
      spec:'2px 描边 · 青→靛 · 分段条（下载段渐变填充） · 播放键圆角方', desc:'功能行做成分段控件，选中段渐变填充白图标，切换感清晰。' },
    { n:'10', name:'悬浮卡片', g:['#FB7185','#C084FC'], sw:2.0, dir:'45', frow:'float', play:'glow',
      spec:'2px 描边 · 玫瑰→兰紫 · 悬浮胶囊带投影 · 播放键外发光', desc:'功能行悬浮成卡片，玫瑰到兰紫，柔和有层次。' }
  ];

  function optsFor(o, white) {
    var d = { h:[0,12,24,12], v:[12,0,12,24], '45':[0,0,24,24] }[o.dir];
    return { a:o.g[0], b:o.g[1], x1:d[0], y1:d[1], x2:d[2], y2:d[3], sw:o.sw, glow:o.play==='glow'||o.glow, duo:o.duo, white:!!white, playOutline:o.play==='ring' };
  }
  function frow(o) {
    var s = '<div class="frow ' + (o.frow || '') + '">';
    FNAMES.forEach(function (f, i) {
      var active = o.frow === 'segment' && f[0] === 'dl';
      var O = optsFor(o, active);
      s += '<button class="fbtn' + (active ? ' active' : '') + '">' + icon(f[0], 23, O) + '<span class="fl">' + f[1] + '</span></button>';
    });
    return s + '</div>';
  }
  function trow(o) {
    var O = optsFor(o);
    var playO = optsFor(o);
    playO.playOutline = o.play === 'ring';
    return '<div class="trow">'
      + '<button class="tico torder">' + icon('order', 21, O) + '</button>'
      + '<button class="tico">' + icon('prev', 25, O) + '</button>'
      + '<button class="tplay ' + o.play + '">' + playIcon(26, playO) + '</button>'
      + '<button class="tico">' + icon('next', 25, O) + '</button>'
      + '</div>';
  }
  function eq(hs) { var s = '<div class="peq">'; for (var i = 0; i < hs.length; i++) s += '<i style="height:' + hs[i] + 'px;animation-delay:' + (i * 0.09).toFixed(2) + 's"></i>'; return s + '</div>'; }
  function nav(o) {
    var s = '<div class="nav">';
    NNAMES.forEach(function (n) {
      var active = n[0] === 'disc';
      var svg = active ? icon(n[0], 22, optsFor(o)) : wrap(paths(n[0], 'var(--t2)', 1.9), 22);
      s += '<button class="ni' + (active ? ' on' : '') + '">' + svg + '<span class="nl">' + n[1] + '</span></button>';
    });
    return s + '</div>';
  }
  function phone(themeCls, o) {
    return '<div class="phone ' + themeCls + '" style="--ga:' + o.g[0] + ';--gb:' + o.g[1] + '">'
      + '<div class="status"><span>9:41</span><span>&#9679;&#9679;&#9679;</span></div>'
      + '<div class="screen"><div class="pback">&#8592; 返回</div><div class="pgrow"></div>'
      + '<div class="pdisc"><span>&#9834;</span></div><div class="pgrow"></div>'
      + '<div class="ptitle">夜曲</div><div class="partist">周杰伦 · 十一月的萧邦</div><div class="pgrow"></div>'
      + eq([40,72,54,90,60,82,48,68,34,58]) + '<div class="pgrow"></div>'
      + '<div class="ptrack"><i></i></div><div class="ptimes"><span>01:24</span><span>03:51</span></div><div class="pgrow"></div>'
      + trow(o) + '<div class="pgrow"></div>' + frow(o)
      + '<div class="pgrow" style="flex:0 0 6px"></div>' + nav(o) + '</div></div>';
  }
  function strip(themeCls, o) {
    var s = '<div class="strip ' + themeCls + '">';
    FNAMES.concat(TNAMES.slice(0, 1)).concat(TNAMES.slice(2)).forEach(function (f) {
      s += '<div class="cell">' + icon(f[0], 40, optsFor(o)) + '<div class="lb">' + f[1] + '</div></div>';
    });
    return s + '</div>';
  }

  var grid = document.getElementById('grid');
  SETS.forEach(function (o) {
    var wrapEl = document.createElement('div'); wrapEl.className = 'opt';
    wrapEl.innerHTML = '<div class="top"><div class="label"><b>' + o.n + '</b>' + o.name + '</div><div class="spec">' + o.spec + '</div></div><div class="desc">' + o.desc + '</div>'
      + '<div class="wrap"><div class="col"><div class="t">图标条 · 浅色</div>' + strip('th-light', o) + '</div>'
      + '<div class="col"><div class="t">图标条 · 暗色</div>' + strip('th-dark', o) + '</div></div>'
      + '<div class="wrap"><div class="col"><div class="t">实景 · 浅色</div>' + phone('th-light', o) + '</div>'
      + '<div class="col"><div class="t">实景 · 暗色</div>' + phone('th-dark', o) + '</div></div>';
    grid.appendChild(wrapEl);
  });

  document.getElementById('animBtn').onclick = function () { document.body.classList.toggle('paused'); this.textContent = document.body.classList.contains('paused') ? '播放动画' : '暂停动画'; };
  document.getElementById('pageBtn').onclick = function () { document.body.classList.toggle('darkpage'); this.textContent = document.body.classList.contains('darkpage') ? '页面浅色' : '页面暗色'; };
})();
</script>
</body>
</html>
