<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>在线音乐 · 播放器页排版 6 套（旋律柱 · 180dp · 跟节奏）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg1:#F9F6FF; --bg2:#EEE7FA; --card:#FFFFFF; --card2:#F6F1FE;
    --t1:#2A2340; --t2:#6F6389; --line:#EFE8FB; --chip:#F1EAFC;
    --g0:#8B5CF6; --g1:#D8B4FE; --g2:#FFAFCC;
  }
  body.dark {
    --bg1:#130D1C; --bg2:#1A1226; --card:#1D1530; --card2:#241A3A;
    --t1:#EDE7FB; --t2:#B0A0D2; --line:#2C2145; --chip:#241A3A;
    --g0:#9F7BFF; --g1:#DCC3FF; --g2:#FFB8D4;
  }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--t1); min-height: 100vh; padding: 26px 16px 80px;
    background:
      radial-gradient(900px 520px at 6% -6%, rgba(237,226,255,.9) 0%, rgba(237,226,255,0) 62%),
      radial-gradient(900px 620px at 106% 4%, rgba(255,225,238,.9) 0%, rgba(255,225,238,0) 58%),
      linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
    background-attachment: fixed;
  }
  body.dark { background: radial-gradient(900px 520px at 6% -6%, #241540 0%, rgba(36,21,64,0) 62%), radial-gradient(900px 620px at 106% 4%, #33132e 0%, rgba(51,19,46,0) 58%), linear-gradient(180deg,#130D1C 0%,#1A1226 100%); }
  .head { max-width: 1560px; margin: 0 auto; }
  .head h1 { font-size: 23px; }
  .head h1 em { font-style: normal; background: linear-gradient(92deg, var(--g0), var(--g1), var(--g2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .head p { font-size: 12.5px; color: var(--t2); margin-top: 9px; line-height: 1.9; max-width: 1100px; }
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 11px 14px; max-width: 1100px; box-shadow: 0 10px 24px rgba(96,66,160,.08); }
  .bar button { border: none; cursor: pointer; font-weight: 800; font-size: 12.5px; color: #fff; background: linear-gradient(135deg, var(--g0), var(--g1)); padding: 9px 16px; border-radius: 11px; }
  .bar .g { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--t2); }
  .bar .o { font-weight: 800; color: var(--g0); min-width: 26px; text-align: center; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 140px; accent-color: var(--g0); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(390px, 1fr)); gap: 30px; max-width: 1560px; margin: 26px auto 0; }
  .opt { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .opt .label { font-size: 13px; font-weight: 800; }
  .opt .label b { font-size: 10.5px; color: #fff; background: linear-gradient(135deg, var(--g0), var(--g2)); padding: 2px 7px; border-radius: 999px; margin-right: 7px; vertical-align: 1px; }
  .opt .desc { font-size: 11px; color: var(--t2); }

  .phone { width: 390px; height: 844px; border-radius: 44px; overflow: hidden; position: relative; background: var(--bg2); box-shadow: 0 26px 60px rgba(60,40,110,.28), 0 0 0 10px rgba(20,12,32,.85); }
  body.dark .phone { box-shadow: 0 26px 60px rgba(0,0,0,.6), 0 0 0 10px rgba(0,0,0,.9); }
  .status { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 26px; font-size: 12.5px; font-weight: 700; color: var(--t1); }
  .screen { position: absolute; inset: 44px 0 0 0; display: flex; flex-direction: column; }
  .pad { padding: 0 22px; }
  .back { font-size: 13px; font-weight: 800; color: var(--g0); }
  .title { font-weight: 800; }
  .sub { color: var(--t2); }
  .bars { position: relative; width: 100%; }
  .bars canvas { display: block; width: 100%; height: 180px; }
  .times { display: flex; justify-content: space-between; font-size: 11px; color: var(--t2); font-variant-numeric: tabular-nums; }
  .track { height: 5px; border-radius: 999px; background: var(--chip); overflow: hidden; }
  .track > i { display: block; height: 100%; width: 42%; border-radius: 999px; background: linear-gradient(90deg, var(--g0), var(--g1), var(--g2)); }
  .ctrl { display: flex; align-items: center; justify-content: center; gap: 26px; }
  .ctrl .ic { font-size: 22px; color: var(--t1); }
  .ctrl .play { width: 68px; height: 68px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; color: #fff; background: linear-gradient(135deg, var(--g0), var(--g1), var(--g2)); box-shadow: 0 12px 26px rgba(139,92,246,.4); }
  .mini-actions { display: flex; justify-content: center; gap: 30px; font-size: 20px; color: var(--t2); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; }
  .cx { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .cover { width: 220px; height: 220px; border-radius: 24px; background: linear-gradient(135deg, var(--g0), var(--g1), var(--g2)); position: relative; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 74px; box-shadow: 0 20px 44px rgba(139,92,246,.34); }
  .disc { width: 240px; height: 240px; border-radius: 50%; background: repeating-radial-gradient(circle at 50% 50%, rgba(0,0,0,.16) 0 4px, rgba(0,0,0,0) 4px 9px), linear-gradient(135deg, var(--g0), var(--g1), var(--g2)); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 40px; box-shadow: 0 20px 44px rgba(139,92,246,.34); animation: spin 9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .blurbg { position: absolute; inset: 0; background: linear-gradient(160deg, var(--g0), var(--g1), var(--g2)); opacity: .16; }
  .blurbg:after { content: ""; position: absolute; inset: -40px; background: radial-gradient(60% 50% at 30% 30%, var(--g2), transparent 70%), radial-gradient(60% 50% at 70% 70%, var(--g0), transparent 70%); filter: blur(30px); }
  .glass { background: color-mix(in srgb, var(--card) 72%, transparent); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 24px; }
  .lyric { font-size: 15px; line-height: 2.1; color: var(--t2); }
  .lyric .on { color: var(--t1); font-weight: 800; font-size: 17px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--t2); background: var(--chip); padding: 5px 11px; border-radius: 999px; }
</style>
</head>
<body>

<div class="head">
  <h1>播放器页 <em>6 套排版</em> · 旋律柱 180dp · 跟节奏跳动</h1>
  <p>每套都为手机竖屏（390×844）。中部动画即模块的「旋律柱」：整组占容器宽度 <b>80%</b>、高 <b>180dp</b>、流光渐变、由节拍驱动跳动（模块内接播放器实时频谱）。切换浅色 / 暗色查看双态。</p>
  <div class="bar">
    <button id="playBtn">暂停</button>
    <div class="g">节奏 BPM <input id="bpm" type="range" min="60" max="180" value="120"><span class="o" id="bpmO">120</span></div>
    <button id="themeBtn">暗色</button>
  </div>
</div>

<div class="grid" id="grid"></div>

<script>
(function () {
  var st = { play: true, t: 0, last: 0, bpm: 120, dark: false };
  var dpr = Math.max(1, Math.min(3, devicePixelRatio || 1));

  function cols() { return st.dark ? ['#9F7BFF', '#DCC3FF', '#FFB8D4'] : ['#8B5CF6', '#D8B4FE', '#FFAFCC']; }
  function env(t) { var p = 60000 / st.bpm, f = (t % p) / p; return Math.pow(1 - f, 2.2); }
  function spectrum(t, n) {
    var e = env(t), a = new Float32Array(n);
    for (var i = 0; i < n; i++) {
      var base = 0.18 + 0.32 * Math.abs(Math.sin(i * 1.7 + t / 320));
      var kick = e * (1 - i / n) * 0.95;
      var noise = 0.14 * Math.abs(Math.sin(i * 3.13 + t / 90));
      a[i] = Math.max(0, Math.min(1, base + kick + noise));
    }
    return a;
  }
  function rr(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2); ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  // 旋律柱：整组占宽 80% 居中，高 180dp，流光渐变横向流动
  function drawBars(ctx, w, h, t) {
    var n = 22, span = w * 0.80, x0 = (w - span) / 2;
    var gap = 3, bw = (span - gap * (n - 1)) / n;
    var sp = spectrum(t, n), c = cols();
    var p = (t / 3200) % 1, shift = 2 * span * p;
    var g = ctx.createLinearGradient(x0 - shift, 0, x0 + 2 * span - shift, 0);
    g.addColorStop(0, c[0]); g.addColorStop(0.33, c[1]); g.addColorStop(0.66, c[2]); g.addColorStop(1, c[0]);
    ctx.fillStyle = g;
    var base = h * 0.94;
    for (var i = 0; i < n; i++) {
      var bh = Math.max(6, sp[i] * h * 0.88);
      var x = x0 + (bw + gap) * i;
      rr(ctx, x, base - bh, bw, bh, Math.min(bw, 4)); ctx.fill();
    }
  }

  var VIZ = [];
  function mountViz(el) {
    var cv = document.createElement('canvas');
    el.appendChild(cv);
    var it = { cv: cv, ctx: cv.getContext('2d') };
    function size() {
      var w = el.clientWidth || 340, h = 180;
      cv.width = w * dpr; cv.height = h * dpr;
      cv.style.width = w + 'px'; cv.style.height = h + 'px';
      it.ctx.setTransform(dpr, 0, 0, dpr, 0, 0); it.w = w; it.h = h;
    }
    it.size = size; size();
    VIZ.push(it);
    return it;
  }

  var OPTIONS = [
    { n: 1, name: '封面顶置 · 经典', desc: '大封面 → 标题 → 旋律柱 → 进度 → 控制', render: function (s) {
      var w = document.createElement('div'); w.className = 'screen'; w.style.padding = '0 22px';
      w.innerHTML =
        '<div class="back" style="margin:6px 0 10px">\u2190 返回</div>'
        + '<div class="cx"><div class="cover">\u266A</div></div>'
        + '<div class="title" style="margin:20px 0 4px;font-size:20px;text-align:center">夜曲</div>'
        + '<div class="sub" style="font-size:13px;text-align:center">周杰伦 · 十一月的萧邦</div>'
        + '<div class="bars" id="v1" style="margin:14px 0 8px"></div>'
        + '<div class="times"><span>01:24</span><span>03:51</span></div>'
        + '<div class="track" style="margin:6px 0 16px"><i></i></div>'
        + '<div class="ctrl"><span class="ic">\u23EE</span><span class="play">\u25B6</span><span class="ic">\u23ED</span></div>'
        + '<div class="mini-actions" style="margin-top:22px"><span>\u2B07</span><span>\u27A4</span></div>';
      s.appendChild(w); mountViz(w.querySelector('#v1'));
    } },

    { n: 2, name: '沉浸背景 · 玻璃卡', desc: '渐变模糊底，封面居中，控制浮于玻璃卡上', render: function (s) {
      var w = document.createElement('div'); w.className = 'screen';
      w.innerHTML = '<div class="blurbg"></div>';
      var inner = document.createElement('div'); inner.style.cssText = 'position:relative;padding:0 22px;display:flex;flex-direction:column;flex:1';
      inner.innerHTML =
        '<div class="back" style="margin:6px 0 8px">\u2190 返回</div>'
        + '<div class="cx"><div class="cover" style="width:190px;height:190px;font-size:64px">\u266A</div></div>'
        + '<div class="title" style="margin:16px 0 3px;font-size:19px;text-align:center">夜曲</div>'
        + '<div class="sub" style="font-size:12.5px;text-align:center">周杰伦</div>'
        + '<div class="glass" style="margin-top:auto;padding:14px 16px 16px">'
        + '  <div class="bars" id="v2"></div>'
        + '  <div class="times"><span>01:24</span><span>03:51</span></div>'
        + '  <div class="track" style="margin:6px 0 14px"><i></i></div>'
        + '  <div class="ctrl"><span class="ic">\u23EE</span><span class="play" style="width:62px;height:62px;font-size:24px">\u25B6</span><span class="ic">\u23ED</span></div>'
        + '</div>';
      w.appendChild(inner); s.appendChild(w); mountViz(inner.querySelector('#v2'));
    } },

    { n: 3, name: '黑胶唱片 · 旋转', desc: '圆形唱片旋转，旋律柱在其下方', render: function (s) {
      var w = document.createElement('div'); w.className = 'screen'; w.style.padding = '0 22px';
      w.innerHTML =
        '<div class="back" style="margin:6px 0 12px">\u2190 返回</div>'
        + '<div class="cx"><div class="disc">\u266A</div></div>'
        + '<div class="title" style="margin:22px 0 4px;font-size:20px;text-align:center">夜曲</div>'
        + '<div class="sub" style="font-size:13px;text-align:center">周杰伦 · 十一月的萧邦</div>'
        + '<div class="bars" id="v3" style="margin:16px 0 8px"></div>'
        + '<div class="times"><span>01:24</span><span>03:51</span></div>'
        + '<div class="track" style="margin:6px 0 16px"><i></i></div>'
        + '<div class="ctrl"><span class="ic">\u23EE</span><span class="play">\u25B6</span><span class="ic">\u23ED</span></div>';
      s.appendChild(w); mountViz(w.querySelector('#v3'));
    } },

    { n: 4, name: '卡片分层', desc: '上部封面区，下部卡片承载旋律柱与控制', render: function (s) {
      var w = document.createElement('div'); w.className = 'screen';
      var top = document.createElement('div'); top.style.cssText = 'padding:8px 22px 0;position:relative';
      top.innerHTML =
        '<div class="back" style="margin:2px 0 8px">\u2190 返回</div>'
        + '<div class="cx"><div class="cover" style="width:200px;height:200px;font-size:66px">\u266A</div></div>'
        + '<div class="title" style="margin:16px 0 3px;font-size:20px;text-align:center">夜曲</div>'
        + '<div class="sub" style="font-size:12.5px;text-align:center;margin-bottom:16px">周杰伦</div>';
      var panel = document.createElement('div'); panel.className = 'card';
      panel.style.cssText = 'margin:auto 14px 14px;padding:16px 18px 18px';
      panel.innerHTML =
        '<div class="bars" id="v4"></div>'
        + '<div class="times"><span>01:24</span><span>03:51</span></div>'
        + '<div class="track" style="margin:6px 0 16px"><i></i></div>'
        + '<div class="ctrl"><span class="ic">\u23EE</span><span class="play" style="width:64px;height:64px">\u25B6</span><span class="ic">\u23ED</span></div>';
      w.appendChild(top); w.appendChild(panel); s.appendChild(w); mountViz(panel.querySelector('#v4'));
    } },

    { n: 5, name: '极简居中', desc: '无封面，标题大字 + 旋律柱居中，最干净', render: function (s) {
      var w = document.createElement('div'); w.className = 'screen'; w.style.padding = '0 22px';
      w.innerHTML =
        '<div class="back" style="margin:6px 0 0">\u2190 返回</div>'
        + '<div style="margin:auto 0" class="cx">'
        + '  <div class="title" style="font-size:27px;text-align:center">夜曲</div>'
        + '  <div class="sub" style="font-size:13.5px;margin-top:8px">周杰伦 · 十一月的萧邦</div>'
        + '  <div class="bars" id="v5" style="margin:26px 0 10px"></div>'
        + '  <div class="times" style="width:100%"><span>01:24</span><span>03:51</span></div>'
        + '  <div class="track" style="margin:6px 0 20px;width:100%"><i></i></div>'
        + '  <div class="ctrl"><span class="ic">\u23EE</span><span class="play">\u25B6</span><span class="ic">\u23ED</span></div>'
        + '  <div class="mini-actions" style="margin-top:26px"><span>\u2B07</span><span>\u27A4</span></div>'
        + '</div>';
      s.appendChild(w); mountViz(w.querySelector('#v5'));
    } },

    { n: 6, name: '歌词优先', desc: '旋律柱作中景，前景标题 + 逐行歌词 + 控制', render: function (s) {
      var w = document.createElement('div'); w.className = 'screen'; w.style.padding = '0 22px';
      w.innerHTML =
        '<div class="back" style="margin:6px 0 14px">\u2190 返回</div>'
        + '<div class="chip">\uD83C\uDFA7 无损 FLAC</div>'
        + '<div class="title" style="margin:12px 0 10px;font-size:21px">夜曲</div>'
        + '<div class="bars" id="v6"></div>'
        + '<div class="lyric" style="margin:16px 0">'
        + '  <div>一群嗜血的蚂蚁 被腐肉所吸引</div>'
        + '  <div class="on">我面无表情 看孤独的风景</div>'
        + '  <div>失去你 爱恨开始分明</div>'
        + '</div>'
        + '<div style="margin-top:auto">'
        + '  <div class="times"><span>01:24</span><span>03:51</span></div>'
        + '  <div class="track" style="margin:6px 0 16px"><i></i></div>'
        + '  <div class="ctrl" style="padding-bottom:16px"><span class="ic">\u23EE</span><span class="play">\u25B6</span><span class="ic">\u23ED</span></div>'
        + '</div>';
      s.appendChild(w); mountViz(w.querySelector('#v6'));
    } }
  ];

  var grid = document.getElementById('grid');
  OPTIONS.forEach(function (o) {
    var wrap = document.createElement('div'); wrap.className = 'opt';
    var label = document.createElement('div'); label.className = 'label';
    label.innerHTML = '<b>0' + o.n + '</b>' + o.name;
    var desc = document.createElement('div'); desc.className = 'desc'; desc.textContent = o.desc;
    wrap.appendChild(label); wrap.appendChild(desc);
    var phone = document.createElement('div'); phone.className = 'phone';
    var status = document.createElement('div'); status.className = 'status';
    status.innerHTML = '<span>9:41</span><span>\u25CF\u25CF\u25CF</span>';
    phone.appendChild(status);
    o.render(phone);
    wrap.appendChild(phone);
    grid.appendChild(wrap);
  });

  function frame(ts) {
    if (!st.last) st.last = ts;
    var dt = Math.min(60, ts - st.last); st.last = ts;
    if (st.play) st.t += dt;
    VIZ.forEach(function (it) {
      if (it.cv.clientWidth && it.w !== it.cv.clientWidth) it.size();
      it.ctx.clearRect(0, 0, it.w, it.h);
      drawBars(it.ctx, it.w, it.h, st.t);
    });
    requestAnimationFrame(frame);
  }
  addEventListener('resize', function () { VIZ.forEach(function (it) { it.size(); }); });

  document.getElementById('playBtn').onclick = function () { st.play = !st.play; this.textContent = st.play ? '暂停' : '播放'; };
  document.getElementById('themeBtn').onclick = function () { st.dark = !st.dark; document.body.classList.toggle('dark', st.dark); this.textContent = st.dark ? '浅色' : '暗色'; };
  document.getElementById('bpm').oninput = function () { st.bpm = +this.value; document.getElementById('bpmO').textContent = this.value; };

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
