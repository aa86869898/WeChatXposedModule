<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeShaoWeChat 高速下载</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .card {
    background: #fff; border-radius: 20px; padding: 32px; max-width: 460px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,.35); text-align: center;
  }
  h1 { font-size: 22px; color: #1a1a2e; margin-bottom: 4px; }
  .ver { color: #888; font-size: 14px; margin-bottom: 18px; }
  .btn {
    display: block; width: 100%; padding: 16px; border: none; border-radius: 12px;
    font-size: 18px; font-weight: 600; cursor: pointer; text-decoration: none;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: linear-gradient(135deg, #22c1c3, #fdbb2d); color: #fff; box-shadow: 0 6px 20px rgba(34,193,195,.35); }
  .btn-ghost { background: #f2f3f7; color: #333; margin-top: 12px; font-size: 15px; padding: 12px; }
  .bar-wrap { background: #eef0f4; border-radius: 20px; height: 12px; margin: 18px 0 8px; overflow: hidden; }
  .bar { height: 100%; width: 0; background: linear-gradient(90deg, #22c1c3, #fdbb2d); border-radius: 20px; transition: width .2s; }
  #status { font-size: 13px; color: #666; min-height: 20px; margin-top: 4px; word-break: break-all; }
  .tip { font-size: 12px; color: #999; margin-top: 14px; line-height: 1.6; text-align: left; }
</style>
</head>
<body>
<div class="card">
  <h1>LeShaoWeChat 模块下载</h1>
<div class="ver">版本 3.0.176（v30176）</div>
  <a class="btn btn-ghost" href="LeShaoWeChat-v30176.apk" download>普通下载（单线程 0.5MB/s）</a>
  <a class="btn btn-ghost" href="download/index.html" target="_blank">查看全部历史版本</a>

  <div class="bar-wrap"><div class="bar" id="bar"></div></div>
  <div id="status">点击按钮开始，浏览器自动分段并发下载后合并。</div>

  <div class="tip">
    原理：普通链接受平台预览代理单连接限速（约 0.5MB/s）。本页用 8 个并发分段请求同时下载，
    在浏览器内合并为完整 APK，实测可提速至 2.5MB/s 以上。下载器（IDM/aria2）也支持同样效果。
  </div>
</div>

<script>
var FILE = 'LeShaoWeChat-v30176.apk';
var CONCURRENCY = 8;

function $(id) { return document.getElementById(id); }

function fmt(n) { return (n / 1048576).toFixed(1); }

async function getSize() {
  var r = await fetch(FILE, { method: 'HEAD' });
  var len = parseInt(r.headers.get('Content-Length'), 10);
  if (!len) throw new Error('无法获取文件大小');
  return len;
}

async function getSegment(start, end) {
  var r = await fetch(FILE, { headers: { Range: 'bytes=' + start + '-' + end } });
  if (r.status !== 206 && !r.ok) throw new Error('HTTP ' + r.status);
  return await r.arrayBuffer();
}

async function fastDownload() {
  var btn = $('fastBtn');
  btn.disabled = true;
  $('bar').style.width = '0%';
  $('status').textContent = '正在获取文件大小...';
  try {
    var total = await getSize();
    var segSize = Math.ceil(total / CONCURRENCY);
    var segs = [];
    for (var i = 0; i < CONCURRENCY; i++) {
      var start = i * segSize;
      var end = Math.min(total - 1, start + segSize - 1);
      if (start >= total) break;
      segs.push({ start: start, end: end });
    }
    $('status').textContent = '已启动 ' + segs.length + ' 个并发线程，总大小 ' + fmt(total) + ' MB ...';
    var buffers = new Array(segs.length);
    var done = 0;
    await Promise.all(segs.map(async function (s, idx) {
      buffers[idx] = await getSegment(s.start, s.end);
      done++;
      var pct = Math.round(done / segs.length * 100);
      $('bar').style.width = pct + '%';
      $('status').textContent = '下载中 ' + pct + '%（' + done + '/' + segs.length + ' 段）';
    }));
    var blob = new Blob(buffers, { type: 'application/vnd.android.package-archive' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = FILE;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
    $('bar').style.width = '100%';
    $('status').textContent = '✅ 下载完成，正在保存文件...';
  } catch (e) {
    $('status').textContent = '下载失败：' + e.message + '，请用下方普通下载重试';
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
