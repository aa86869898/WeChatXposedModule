<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>粉色系主题 · 模块主面板预览</title>
<style>
  :root {
    --primary: #E84393; --on-primary: #FFFFFF; --primary-container: #FFD8E6; --on-primary-container: #3A001C;
    --secondary: #A05B74; --tertiary: #7C6BA8; --surface: #FFF8FA; --on-surface: #22191C;
    --surface-variant: #F3DDE4; --on-surface-variant: #52434A; --outline: #85737A; --error: #BA1A1A;
    --surface-container-low: #FDF3F8; --surface-container-high: #F8E7EF; --outline-variant: #E4CDD8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Roboto", sans-serif;
    background: #F0EEF4; color: #2A2340; display: flex; flex-direction: column; align-items: center;
    padding: 28px 16px; min-height: 100vh;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { font-size: 13px; color: #6F6389; margin-bottom: 18px; }

  .controls {
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 14px;
    background: #fff; padding: 12px 18px; border-radius: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.06);
    margin-bottom: 22px; max-width: 660px;
  }
  .mode-switch { display: flex; background: #F3F1F7; border-radius: 20px; padding: 3px; gap: 2px; }
  .mode-switch button {
    border: none; background: transparent; padding: 7px 16px; border-radius: 18px; font-size: 13px; cursor: pointer;
    color: #6F6389; transition: all .2s;
  }
  .mode-switch button.active { background: #fff; color: #E84393; font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .theme-picker { display: flex; align-items: center; gap: 6px; }
  .theme-dot {
    width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 3px solid transparent;
    transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.2);
  }
  .theme-dot:hover { transform: scale(1.15); }
  .theme-dot.active { border-color: #2A2340; transform: scale(1.15); }
  .theme-name { font-size: 13px; font-weight: 700; color: #E84393; min-width: 88px; text-align: center; }

  .phone { width: 375px; max-width: 100%; border-radius: 40px; background: #1C1A20; padding: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
  .screen {
    height: 700px; max-height: 78vh; border-radius: 30px; overflow: hidden; position: relative;
    background: var(--surface); display: flex; flex-direction: column; transition: background .3s;
  }
  .statusbar { display: flex; justify-content: space-between; padding: 10px 22px 4px; font-size: 12px; font-weight: 600; color: var(--on-surface); }

  .topbar { background: var(--primary); padding: 18px 16px; text-align: center; }
  .topbar .title { font-size: 22px; font-weight: 800; color: var(--on-primary); }
  .topbar .ver { font-size: 9px; color: var(--on-primary); opacity: .7; margin-top: 3px; }

  .scroll { flex: 1; overflow-y: auto; padding-bottom: 12px; }

  .user-card {
    display: flex; align-items: center; gap: 12px; margin: 14px 16px 12px; padding: 14px 16px;
    background: var(--surface-container-low); border-radius: 24px;
  }
  .avatar {
    width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0;
    background: var(--primary-container); color: var(--on-primary-container);
    display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800;
  }
  .u-name { font-size: 16px; font-weight: 700; color: var(--on-surface); }
  .u-wxid { font-size: 11px; color: var(--on-surface-variant); margin-top: 2px; }
  .u-arrow { margin-left: auto; font-size: 20px; color: var(--outline); }

  .search {
    display: flex; align-items: center; gap: 8px; margin: 0 16px 12px; padding: 10px 14px;
    background: var(--surface-container-high); border-radius: 28px; color: var(--on-surface-variant); font-size: 14px;
  }

  .card {
    margin: 0 16px 12px; padding: 4px; background: var(--surface-container-low); border-radius: 20px;
  }
  .row { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 16px; }
  .icon-box {
    width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
    background: var(--primary-container); display: flex; align-items: center; justify-content: center; font-size: 17px;
  }
  .row-title { flex: 1; font-size: 15px; color: var(--on-surface); }
  .row-title.accent { color: var(--primary); font-weight: 700; }
  .row-arrow { font-size: 20px; color: var(--outline); }
  .divider { height: 1px; margin: 2px 12px; background: var(--outline-variant); }
</style>
</head>
<body>
  <h1>粉色系主题 · 模块主面板预览</h1>
  <div class="sub">模拟「乐少助手」主面板 · 切换主题与浅色/暗色模式</div>

  <div class="controls">
    <div class="mode-switch">
      <button id="btnLight" class="active" onclick="setMode('light')">浅色</button>
      <button id="btnDark" onclick="setMode('dark')">暗色</button>
    </div>
    <div class="theme-picker" id="themePicker"></div>
    <div class="theme-name" id="themeName">01 · 玫瑰粉</div>
  </div>

  <div class="phone">
    <div class="screen" id="screen">
      <div class="statusbar"><span>9:41</span><span>📶 🔋</span></div>
      <div class="topbar">
        <div class="title">乐少助手</div>
        <div class="ver">v3.0.9 · 微信功能增强模块</div>
      </div>
      <div class="scroll">
        <div class="user-card">
          <div class="avatar">微</div>
          <div>
            <div class="u-name">微信用户</div>
            <div class="u-wxid">wxid_leshao_v3</div>
          </div>
          <div class="u-arrow">›</div>
        </div>
        <div class="search">🔍 <span>搜索模块功能...</span></div>
        <div class="card">
          <div class="row"><div class="icon-box">❤️</div><div class="row-title accent">爱心捐赠</div><div class="row-arrow">›</div></div>
          <div class="divider"></div>
          <div class="row"><div class="icon-box">👤</div><div class="row-title">个人中心</div><div class="row-arrow">›</div></div>
        </div>
        <div class="card">
          <div class="row"><div class="icon-box">👥</div><div class="row-title">联系人和群聊</div><div class="row-arrow">›</div></div>
          <div class="divider"></div>
          <div class="row"><div class="icon-box">📋</div><div class="row-title">聊天分组</div><div class="row-arrow">›</div></div>
          <div class="divider"></div>
          <div class="row"><div class="icon-box">🔊</div><div class="row-title">TTS语音播报</div><div class="row-arrow">›</div></div>
          <div class="divider"></div>
          <div class="row"><div class="icon-box">🎵</div><div class="row-title">在线音乐</div><div class="row-arrow">›</div></div>
          <div class="divider"></div>
          <div class="row"><div class="icon-box">ℹ️</div><div class="row-title">关于模块</div><div class="row-arrow">›</div></div>
        </div>
      </div>
    </div>
  </div>

<script>
const PALETTES = [
  { name: "01 · 玫瑰粉", light: { primary:"#E84393", onPrimary:"#FFFFFF", primaryContainer:"#FFD8E6", onPrimaryContainer:"#3A001C", secondary:"#A05B74", tertiary:"#7C6BA8", surface:"#FFF8FA", onSurface:"#22191C", surfaceVariant:"#F3DDE4", onSurfaceVariant:"#52434A", outline:"#85737A", error:"#BA1A1A" }, dark: { primary:"#FFB0CE", onPrimary:"#5C0029", primaryContainer:"#8C2A55", onPrimaryContainer:"#FFD8E6", secondary:"#E5BCC9", tertiary:"#CFC0EA", surface:"#1E1117", onSurface:"#FCE8EE", surfaceVariant:"#514349", onSurfaceVariant:"#D8C2C9", outline:"#A08D94", error:"#FFB4AB" } },
  { name: "02 · 樱花粉", light: { primary:"#FF8FC5", onPrimary:"#4A0025", primaryContainer:"#FFD8E6", onPrimaryContainer:"#3A0021", secondary:"#965F78", tertiary:"#7B5671", surface:"#FFF8FA", onSurface:"#22191C", surfaceVariant:"#F3DDE4", onSurfaceVariant:"#52434A", outline:"#85737A", error:"#BA1A1A" }, dark: { primary:"#FFA6C9", onPrimary:"#5C0029", primaryContainer:"#8C2A55", onPrimaryContainer:"#FFD8E6", secondary:"#E5BCC9", tertiary:"#CFC0EA", surface:"#201019", onSurface:"#FCE8EE", surfaceVariant:"#514349", onSurfaceVariant:"#D8C2C9", outline:"#A08D94", error:"#FFB4AB" } },
  { name: "03 · 樱粉", light: { primary:"#F276A8", onPrimary:"#FFFFFF", primaryContainer:"#FFD9E3", onPrimaryContainer:"#3E001D", secondary:"#A05B78", tertiary:"#7A566F", surface:"#FFF8FA", onSurface:"#22191C", surfaceVariant:"#F3DDE4", onSurfaceVariant:"#52434A", outline:"#85737A", error:"#BA1A1A" }, dark: { primary:"#FFB8D4", onPrimary:"#5C0029", primaryContainer:"#8C2A55", onPrimaryContainer:"#FFD8E6", secondary:"#E5BCC9", tertiary:"#CFC0EA", surface:"#1E1117", onSurface:"#FCE8EE", surfaceVariant:"#514349", onSurfaceVariant:"#D8C2C9", outline:"#A08D94", error:"#FFB4AB" } },
  { name: "04 · 蔷薇粉", light: { primary:"#E04A8E", onPrimary:"#FFFFFF", primaryContainer:"#FFD8E6", onPrimaryContainer:"#3A001C", secondary:"#A05B74", tertiary:"#7C6BA8", surface:"#FFF8FA", onSurface:"#22191C", surfaceVariant:"#F3DDE4", onSurfaceVariant:"#52434A", outline:"#85737A", error:"#BA1A1A" }, dark: { primary:"#FFB0CE", onPrimary:"#5C0029", primaryContainer:"#8C2A55", onPrimaryContainer:"#FFD8E6", secondary:"#E5BCC9", tertiary:"#CFC0EA", surface:"#211019", onSurface:"#FCE8EE", surfaceVariant:"#514349", onSurfaceVariant:"#D8C2C9", outline:"#A08D94", error:"#FFB4AB" } },
  { name: "05 · 桃粉", light: { primary:"#E85E8A", onPrimary:"#FFFFFF", primaryContainer:"#FFD9E3", onPrimaryContainer:"#3E001D", secondary:"#A05B78", tertiary:"#7A566F", surface:"#FFF8FA", onSurface:"#22191C", surfaceVariant:"#F3DDE4", onSurfaceVariant:"#52434A", outline:"#85737A", error:"#BA1A1A" }, dark: { primary:"#FFC0D8", onPrimary:"#5C0029", primaryContainer:"#8C2A55", onPrimaryContainer:"#FFD8E6", secondary:"#E5BCC9", tertiary:"#CFC0EA", surface:"#1E1117", onSurface:"#FCE8EE", surfaceVariant:"#514349", onSurfaceVariant:"#D8C2C9", outline:"#A08D94", error:"#FFB4AB" } },
  { name: "06 · 莓果粉", light: { primary:"#C63B79", onPrimary:"#FFFFFF", primaryContainer:"#FFD8E6", onPrimaryContainer:"#3A001C", secondary:"#A05B74", tertiary:"#7C6BA8", surface:"#FFF8FA", onSurface:"#22191C", surfaceVariant:"#F3DDE4", onSurfaceVariant:"#52434A", outline:"#85737A", error:"#BA1A1A" }, dark: { primary:"#FF9EBB", onPrimary:"#5C0029", primaryContainer:"#8C2A55", onPrimaryContainer:"#FFD8E6", secondary:"#E5BCC9", tertiary:"#CFC0EA", surface:"#1E1117", onSurface:"#FCE8EE", surfaceVariant:"#514349", onSurfaceVariant:"#D8C2C9", outline:"#A08D94", error:"#FFB4AB" } },
  { name: "07 · 藕粉", light: { primary:"#C93E79", onPrimary:"#FFFFFF", primaryContainer:"#FFD9E3", onPrimaryContainer:"#3E001D", secondary:"#A05B78", tertiary:"#7A566F", surface:"#FFF8FA", onSurface:"#22191C", surfaceVariant:"#F3DDE4", onSurfaceVariant:"#52434A", outline:"#85737A", error:"#BA1A1A" }, dark: { primary:"#FFAFCB", onPrimary:"#5C0029", primaryContainer:"#8C2A55", onPrimaryContainer:"#FFD8E6", secondary:"#E5BCC9", tertiary:"#CFC0EA", surface:"#201019", onSurface:"#FCE8EE", surfaceVariant:"#514349", onSurfaceVariant:"#D8C2C9", outline:"#A08D94", error:"#FFB4AB" } },
  { name: "08 · 粉紫", light: { primary:"#D93D9A", onPrimary:"#FFFFFF", primaryContainer:"#FFD8E6", onPrimaryContainer:"#3A001C", secondary:"#A05B74", tertiary:"#7C6BA8", surface:"#FFF8FA", onSurface:"#22191C", surfaceVariant:"#F3DDE4", onSurfaceVariant:"#52434A", outline:"#85737A", error:"#BA1A1A" }, dark: { primary:"#FFA6C9", onPrimary:"#5C0029", primaryContainer:"#8C2A55", onPrimaryContainer:"#FFD8E6", secondary:"#E5BCC9", tertiary:"#CFC0EA", surface:"#1E1117", onSurface:"#FCE8EE", surfaceVariant:"#514349", onSurfaceVariant:"#D8C2C9", outline:"#A08D94", error:"#FFB4AB" } },
  { name: "09 · 蜜桃粉", light: { primary:"#FF7F9F", onPrimary:"#4A0025", primaryContainer:"#FFD9E3", onPrimaryContainer:"#3E001D", secondary:"#A05B78", tertiary:"#7A566F", surface:"#FFF8FA", onSurface:"#22191C", surfaceVariant:"#F3DDE4", onSurfaceVariant:"#52434A", outline:"#85737A", error:"#BA1A1A" }, dark: { primary:"#FFD0E4", onPrimary:"#5C0029", primaryContainer:"#8C2A55", onPrimaryContainer:"#FFD8E6", secondary:"#E5BCC9", tertiary:"#CFC0EA", surface:"#211019", onSurface:"#FCE8EE", surfaceVariant:"#514349", onSurfaceVariant:"#D8C2C9", outline:"#A08D94", error:"#FFB4AB" } },
  { name: "10 · 淡樱粉", light: { primary:"#D4456E", onPrimary:"#FFFFFF", primaryContainer:"#FFD9E3", onPrimaryContainer:"#3E001D", secondary:"#A05B78", tertiary:"#7A566F", surface:"#FFF8FA", onSurface:"#22191C", surfaceVariant:"#F3DDE4", onSurfaceVariant:"#52434A", outline:"#85737A", error:"#BA1A1A" }, dark: { primary:"#FFB4D2", onPrimary:"#5C0029", primaryContainer:"#8C2A55", onPrimaryContainer:"#FFD8E6", secondary:"#E5BCC9", tertiary:"#CFC0EA", surface:"#1E1117", onSurface:"#FCE8EE", surfaceVariant:"#514349", onSurfaceVariant:"#D8C2C9", outline:"#A08D94", error:"#FFB4AB" } }
];

const VAR_MAP = {
  primary: "--primary", onPrimary: "--on-primary", primaryContainer: "--primary-container",
  onPrimaryContainer: "--on-primary-container", secondary: "--secondary", tertiary: "--tertiary",
  surface: "--surface", onSurface: "--on-surface", surfaceVariant: "--surface-variant",
  onSurfaceVariant: "--on-surface-variant", outline: "--outline", error: "--error"
};

function hexToRgb(hex) {
  const h = hex.replace("#", "");
  return { r: parseInt(h.substring(0,2),16), g: parseInt(h.substring(2,4),16), b: parseInt(h.substring(4,6),16) };
}
function rgbToHex(r,g,b) {
  return "#" + [r,g,b].map(function(v){ return Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0"); }).join("");
}
function mix(c1, c2, w2) {
  const a = hexToRgb(c1), b = hexToRgb(c2);
  return rgbToHex(a.r*(1-w2)+b.r*w2, a.g*(1-w2)+b.g*w2, a.b*(1-w2)+b.b*w2);
}

let currentMode = "light";
let currentIndex = 0;

function applyTheme() {
  const p = PALETTES[currentIndex];
  const c = currentMode === "dark" ? p.dark : p.light;
  const root = document.documentElement.style;
  Object.keys(VAR_MAP).forEach(function(k) { root.setProperty(VAR_MAP[k], c[k]); });
  root.setProperty("--surface-container-low", mix(c.surface, c.surfaceVariant, currentMode === "dark" ? 0.12 : 0.22));
  root.setProperty("--surface-container-high", mix(c.surface, c.surfaceVariant, currentMode === "dark" ? 0.32 : 0.5));
  root.setProperty("--outline-variant", mix(c.surfaceVariant, c.onSurfaceVariant, 0.35));
  document.getElementById("themeName").textContent = p.name;
  const dots = document.querySelectorAll(".theme-dot");
  dots.forEach(function(d, i) { d.classList.toggle("active", i === currentIndex); });
}

function setMode(mode) {
  currentMode = mode;
  document.getElementById("btnLight").classList.toggle("active", mode === "light");
  document.getElementById("btnDark").classList.toggle("active", mode === "dark");
  applyTheme();
}

const picker = document.getElementById("themePicker");
PALETTES.forEach(function(p, i) {
  const dot = document.createElement("div");
  dot.className = "theme-dot" + (i === 0 ? " active" : "");
  dot.style.background = p.light.primary;
  dot.title = p.name;
  dot.addEventListener("click", function() { currentIndex = i; applyTheme(); });
  picker.appendChild(dot);
});
applyTheme();
</script>
</body>
</html>
